　想家人、想人際、想天界（想美好的地方）、寂止思惟——讓心靜下來\n　　　　　　回想以前玩樂的事\n　疑　　　　對過去、未來、現在猶豫不決，　　　　緣起法思惟——想清楚因果\n　　　　　　加上不正確地去想它\n\n　昏沉的具體對治，另一經有一張很生活化的清單——佛陀看到目揵連打坐時打瞌睡，\n　教他一個接一個試：不再想引起睡意的念頭 → 背誦、講述、思考學過的法 → 用兩手揉耳朵 →\n　用冷水洗臉、灑身體 → 走出房間看四方、看星星 → 到戶外經行 → 都不行，就好好躺下，\n　「心作明想」（心裡想著光明），並且一直存著「要起來」的念頭。\n　〔中阿含 83 經《長老上尊睡眠經》｜T01 p.0559c～0560a｜巴利對應 AN 7.61〕\n\n👉 「不正思惟」是關鍵詞（巴利 ayoniso manasikāra，「不從根源上去注意」）。\n　 美好的東西本身不會讓人貪，是「一直用某種方式去想它」讓人貪。\n　 這跟第 7 章「渴愛是被澆水長大的」是同一個道理。\n\n17-3　四念處：「一條讓眾生清淨的路」\n──────────────────\n【原文】\n「有一道淨眾生，度憂畏，滅苦惱，斷啼哭，得正法，謂四念處。」\n〔中阿含 98 經《念處經》｜T01 p.0582b｜巴利對應 MN 10、DN 22〕\n\n【白話】\n「有一條道路，能讓眾生清淨，度過憂愁恐懼，滅除苦惱，斷除哭泣，得到正法，這就是四念處。」\n\n四念處＝四個「放念的地方」：\n　(1) 身念處：觀察身體\n　(2) 受念處：觀察感受（樂、苦、不苦不樂）\n　(3) 心念處：觀察心的狀態（有貪、無貪、有瞋、無瞋、散亂、集中……）\n　(4) 法念處：觀察各種法（五蓋、五蘊、六處、七覺支、四聖諦……）\n\n雜阿含的標準說法：\n\n【原文】\n「云何修四念處？謂內身身觀念住，精勤方便，正智正念，調伏世間憂悲，外身、內外身觀住，\n精勤方便，正念正知，調伏世間憂悲。如是受、心、法，內法、外法、內外法觀念住。」\n〔雜阿含 610 經｜T02 p.0171b｜巴利對應 SN 47.39〕\n\n【白話】\n「怎麼修四念處？就是對自己的身體，就身體本身去觀察，讓念安住在那裡，\n努力用功，清楚明白、保持覺知，放下對世間的貪求和憂惱；對別人的身體、對內外兩者，也這樣觀察。\n感受、心、法，也這樣觀察。」\n\n👉 「身身觀」——「就身體本身去觀察身體」。意思是：看身體就只是看身體，\n　 不要把它看成「我」、不要加上評價（「好醜」「好胖」），也不要跑去想別的。\n　 「調伏世間憂悲」（巴利原文是「放下世間的貪和憂」）——觀察時不被喜歡和不喜歡拉走。\n\n中阿含《念處經》裡，每一念處都有具體的練習方法。整理如下：\n\n【身念處】\n　・行住坐臥：「行則知行，住則知住，坐則知坐，臥則知臥」——走路知道在走路\n　・呼吸：「念入息即知念入息，念出息即知念出息，入息長即知入息長……」（下一節詳講）\n　・觀察身體由各種部分組成（頭髮、指甲、骨頭、內臟……）、由四大組成\n　・觀察身體死後會腐壞（屍體的各個階段）——這是「不淨觀」，用來對治對身體的貪著\n　・禪定的喜樂充滿全身（見 17-5 四禪）\n\n【受念處】\n　・感覺到舒服時，知道「這是舒服的感受」；痛苦時知道「這是痛苦的感受」；平淡時知道\n　・還分「身體的」和「心理的」感受\n　・中阿含把「受」譯作「覺」，所以這一項在經裡叫「觀覺如覺」，例如：\n　　「覺不苦不樂覺時，便知覺不苦不樂覺」（感受到不苦不樂的感受時，就知道「我感受到不苦不樂的感受」）\n　　〔中阿含 98 經《念處經》｜T01 p.0583c〕\n　👉 這直接對準第 7 章說的關鍵接縫：受 → 愛。在「受」的時候看見它，渴愛就比較不會自動接上去。\n\n【心念處】\n　・「有欲心知有欲心如真，無欲心知無欲心如真；有恚、無恚，有癡、無癡……」\n　　（心裡有貪的時候，如實知道「現在心裡有貪」；沒有時，知道沒有）\n　👉 不是要「馬上把貪消滅」，而是先「知道」。知道本身就已經開始改變了。\n\n【法念處】\n　・觀察五蓋：知道現在有沒有蓋、蓋是怎麼生起的、怎麼消失的、以後怎麼不再生起\n　・觀察六處與結縛、七覺支、四聖諦……\n\n（以上整理自中阿含 98 經《念處經》｜T01 p.0582b～0584b，各項原文較長，只節錄關鍵句。）\n\n17-4　安那般那念：觀察呼吸\n──────────────────\n「安那般那」＝入息出息（呼吸）。這是佛陀自己最常用、也最推薦的方法之一。\n雜阿含把它分成十六個步驟：\n\n【原文】\n「念於內息，繫念善學，念於外息，繫念善學。息長息短，覺知一切身入息，於一切身入息善學，\n覺知一切身出息……覺知一切身行息入息……覺知喜，覺知樂，覺知心行，覺知心行息入息……\n覺知心，覺知心悅，覺知心定，覺知心解脫入息……觀察無常，觀察斷，觀察無欲，觀察滅入息……\n是名修安那般那念，身止息、心止息，有覺有觀，寂滅、純一，明分想修習滿足。」\n〔雜阿含 803 經｜T02 p.0206a～b｜巴利對應 SN 54.1〕\n\n整理成四組（每組四步），剛好對應四念處（雜阿含 810 經就是這樣對應的）：\n\n　【第一組：身】\n　　1 吸氣時知道在吸，呼氣時知道在呼\n　　2 長的呼吸知道是長，短的知道是短\n　　3 感覺整個身體在呼吸\n　　4 讓身體的動作（身行）平靜下來，呼吸也變得細緩\n　【第二組：受】\n　　5 感覺到喜\n　　6 感覺到樂\n　　7 感覺到心的作用（心行：感受和認知）\n　　8 讓心的作用平靜下來\n　【第三組：心】\n　　9 感覺到心\n　　10 讓心喜悅\n　　11 讓心專注\n　　12 讓心解脫（從束縛中鬆開）\n　【第四組：法】\n　　13 觀察無常\n　　14 觀察斷（放下）\n　　15 觀察無欲（離欲）\n　　16 觀察滅（止息）\n\n👉 實用的入門方法（依經文的前幾步）：\n　 ・找個安靜的地方坐好，身體端正但不僵硬\n　 ・不用控制呼吸，只是「知道」：現在在吸、現在在呼、這口氣長、那口氣短\n　 ・心跑掉了（一定會跑掉），發現了，就溫和地帶回來——「發現跑掉」本身就是正念的成功\n　 ・從幾分鐘開始，不求久\n　 ・後面的步驟（喜、樂、觀無常……）會隨著心安定自然出現，不用勉強\n\n17-5　四禪：四種深度的專注\n──────────────────\n「禪」（巴利 jhāna）是深度的專注狀態。經文的標準描述（見中阿含 3 經等）：\n\n【原文】\n「聖弟子離欲、離惡不善之法，有覺、有觀，離生喜樂，逮初禪成就遊……\n覺、觀已息，內靜、一心，無覺、無觀，定生喜樂，逮第二禪成就遊……\n離於喜欲，捨無求遊，正念正智而身覺樂，謂聖所說、聖所捨、念、樂住、空，逮第三禪成就遊……\n樂滅、苦滅，喜憂本已滅，不苦不樂、捨、念、清淨，逮第四禪成就遊。」\n〔中阿含 3 經《城喻經》｜T01 p.0423b｜巴利對應 AN 7.67〕\n\n【白話與解釋】\n　初禪：離開感官慾望和不善的心，還有「覺、觀」（心對所緣的初步投注和持續細察；\n　　　　新譯作「尋、伺」），由「遠離」而生起喜和樂。\n　二禪：覺和觀都平息了，內心寧靜、統一，由「定」而生起喜和樂。\n　三禪：連「喜」（興奮的那種喜悅）也放下了，保持平靜（捨），正念、正知，身體感到樂。\n　四禪：樂和苦都止息了，憂和喜也早已止息，只剩不苦不樂、平靜、清楚的覺知，非常清淨。\n\n佛陀用四個比喻來形容禪定充滿全身的感覺（中阿含 98 經《念處經》）：\n\n【原文】\n初禪：「離生喜樂，漬身潤澤，普遍充滿於此身中，離生喜樂無處不遍。\n　　　猶工浴人器盛澡豆，水和成摶，水漬潤澤，普遍充滿無處不周。」\n二禪：「定生喜樂……猶如山泉，清淨不濁，充滿流溢，四方水來，無緣得入，\n　　　即彼泉底，水自涌出，流溢於外，漬山潤澤，普遍充滿無處不周。」\n三禪：「無喜生樂……猶青蓮華，紅、赤、白蓮，水生水長，在於水底，\n　　　彼根莖華葉悉漬潤澤，普遍充滿無處不周。」\n四禪：「以清淨心意解遍滿成就遊……猶有一人，被七肘衣或八肘衣，從頭至足，於其身體無處不覆。」\n〔中阿含 98 經《念處經》｜T01 p.0582c～0583a｜巴利對應 MN 10（此段比喻另見 MN 119、DN 2）〕\n\n【白話】\n　初禪：像澡堂的師傅把澡豆粉加水揉成團，水分滲透到每一處，沒有一處是乾的——\n　　　　遠離帶來的喜樂，滲透全身每一處。\n　二禪：像一座山泉，水不是從外面流進來，而是從泉底自己湧出來，滿溢出去，滋潤整座山——\n　　　　喜樂從內心深處自己湧出來。\n　三禪：像蓮花在水中生長，從根到莖到花葉，都浸潤在水裡——\n　　　　平靜的樂浸潤全身。\n　四禪：像一個人從頭到腳裹著一件七、八肘長的大布，沒有一處沒被包覆——\n　　　　清淨的心遍滿全身。\n\n👉 幾個重點：\n　 ・禪定裡的喜樂是佛陀「大力讚美」的。他說這是「聖者的樂」，不需要害怕或排斥\n　 　（巴利 MN 36 裡，佛陀回憶他想起童年在樹下自然進入初禪，才領悟「這才是覺悟之道」，\n　 　 並且決定「我不必害怕這種與慾望無關的樂」。）\n　 ・禪定是為了讓心有力、清楚，以便觀察實相（慧）。不是目的地\n　 ・第 2 章說過，佛陀出家後跟兩位老師學到的「無所有處」「非想非非想處」比四禪更深，\n　 　但他說那些「不趣涅槃」——因為只有定，沒有慧\n\n17-6　七覺支：七個覺悟的因素\n──────────────────\n　(1) 念覺支：保持覺知\n　(2) 擇法覺支：分辨好壞、善與不善\n　(3) 精進覺支：努力\n　(4) 喜覺支：喜悅\n　(5) 猗覺支（輕安）：身心放鬆、輕快\n　(6) 定覺支：專注\n　(7) 捨覺支：平衡、平靜\n\n前面引的雜阿含 715 經也說了這七支各自靠什麼「餵養」（例：念覺支以四念處為食）。\n最實用的是另一經講的「時機」——七支要看狀況使用：\n\n【原文】\n「若爾時其心微劣、其心猶豫者，不應修猗覺分、定覺分、捨覺分。所以者何？\n微劣心生、微劣猶豫，以此諸法增其微劣故。譬如小火，欲令其燃，增以燋炭。……\n若掉心起，若掉心猶豫，爾時不應修擇法覺分、精進覺分、喜覺分。所以者何？\n掉心起、掉心猶豫，以此諸法能令其增。譬如熾火，欲令其滅，足其乾薪……\n若微劣心生、微劣猶豫，是時應修擇法覺分、精進覺分、喜覺分。……\n譬如小火，欲令其燃，足其乾薪。」\n〔雜阿含 714 經｜T02 p.0191c～0192a｜巴利對應 SN 46.53〕\n\n【白話】\n「如果心低落、無力的時候，不要修輕安、定、捨——這會讓心更沉，就像小火快熄了，\n你還往上面倒燒過的炭灰。……\n如果心浮動、靜不下來的時候，不要修擇法、精進、喜——這會讓心更躁動，\n就像大火正旺，你還往上加乾柴。……\n心低落時，應該修擇法、精進、喜——就像小火要燒旺，就加乾柴。」\n（反過來，心浮動時，應該修輕安、定、捨。）\n\n整理：\n　心低落、昏沉、提不起勁 → 用「振奮」的：擇法（動動腦）、精進（動起來）、喜（想想讓人開心的善事）\n　心浮動、焦躁、停不下來 → 用「平靜」的：輕安（放鬆身體）、定（專注一處）、捨（平衡、放下）\n　念覺支 → 任何時候都需要（同一經的最後一句：「念覺分者，一切兼助。」——念在任何狀況都有幫助）\n\n👉 這是非常高明的「心理調節學」：不是一套方法用到底，而是看心的狀態下藥。\n\n17-7　慈、悲、喜、捨：四無量心\n──────────────────\n除了專注和觀察，經文也大量教導培養「善意」的禪修：\n\n【原文】\n「彼心與慈俱，遍滿一方成就遊，如是二三四方、四維上下，普周一切，心與慈俱，\n無結無怨，無恚無諍，極廣甚大，無量善修，遍滿一切世間成就遊。」\n〔中阿含 15 經《思經》｜T01 p.0438a｜巴利對應 AN 10.217–219〕\n\n【白話】\n「他的心帶著慈愛，遍滿一個方向，然後第二、第三、第四個方向，四個角落，上方、下方，\n普遍到一切地方。心帶著慈愛，沒有怨結、沒有敵意、沒有瞋恨、沒有爭執，\n極為廣大、無法衡量，好好地修習，遍滿整個世界。」\n\n四無量心：\n　慈（mettā）：願眾生快樂、平安（對治瞋）\n　悲（karuṇā）：願眾生離苦（對治傷害心）\n　喜（muditā）：看到別人好，替他高興（對治嫉妒）\n　捨（upekkhā）：平等、平靜地對待一切（對治偏愛和偏惡）\n　（「心與悲俱」「心與喜俱」「心與捨俱」，經文用完全相同的句式。）\n\n同一經還說了一句很重要的話——修慈不只是出家人的事：\n\n【原文】\n「是以男女在家、出家，常當勤修慈心解脫。」\n〔中阿含 15 經《思經》｜T01 p.0438a〕\n【白話】「所以，不管男女、在家還是出家，都應該常常勤修慈心解脫。」\n\n長阿含也記載，修慈心的人不會因此「反而更生氣」：\n\n【原文】\n「若比丘作是言：『我修慈心，更生瞋恚。』餘比丘語言：『汝勿作此言，勿謗如來，\n如來不作是說：欲使修慈解脫，更生瞋恚想，無有是處。佛言：除瞋恚已，然後得慈。』」\n〔長阿含 9 經《眾集經》｜T01 p.0052a｜巴利對應 DN 33〕\n\n【白話】\n「如果有比丘說：『我修慈心，反而更生氣了。』其他比丘應該說：『你不要這樣說，\n不要誣賴如來。如來沒有這樣說過。修慈心解脫而反而更生氣，這是不可能的。\n佛說：瞋恚除去了，然後才能得到慈。』」\n\n👉 實用的慈心練習（後期傳統的常見做法，經文本身只有上面的「遍滿四方」）：\n　 從自己開始 → 親近的人 → 不熟的人 → 討厭的人 → 一切眾生，\n　 在心裡默念「願他平安、願他健康、願他快樂、願他自在」。\n　 【附註．後期】這種「由近及遠」的次第，主要出自五世紀覺音的《清淨道論》。\n\n17-8　常見誤會\n──────────────────\n【常見誤會一】「打坐就是放空、什麼都不想。」\n　→ 定是「心安住在一個對象上，清楚、穩定」，不是「空白」。\n　 　初禪還有「覺、觀」。念處更是「清楚地觀察」。放空、恍神比較接近「昏沉」——那是五蓋之一。\n\n【常見誤會二】「定越深越好，入定越久越厲害。」\n　→ 佛陀的兩位老師都有極深的定，但佛陀說「不趣涅槃」。定是為了慧，不是比賽。\n\n【常見誤會三】「修行時有喜樂是執著，要排斥。」\n　→ 經文大力讚美禪定的喜樂，它是心安定的自然結果，也是放下感官慾望的「替代品」。\n　 　要注意的是「貪著喜樂」，不是喜樂本身。\n\n【常見誤會四】「修定是為了得神通。」\n　→ 經典裡有提到神通，但佛陀多次表示不鼓勵炫耀神通（巴利 DN 11 等），\n　 　解脫靠的是滅盡漏（第 13 章「三明」的第三項）。\n\n【現代對照】(1) 大量研究顯示，正念呼吸練習能改善注意力的穩定性，並降低焦慮與壓力指標。\n　(2) 大腦影像研究發現，有經驗的禪修者在「發呆、胡思亂想」時活躍的「預設模式網路」\n　（default mode network，與「自我相關的思緒漫遊」有關）活動較低——\n　這跟「掉悔蓋＝想東想西、想家人想過去」以及「平息心行」的描述相呼應。\n　(3)「不同心理狀態用不同方法調節」（七覺支的時機），\n　跟現代情緒調節研究中「依情境選擇策略」的觀點相近。\n　（研究出處見第 24 章）\n\n17-9　這一章的重點\n──────────────────\n・定＝心安住、統一、清楚；不是放空；目的是為了慧（止與觀）\n・五蓋：貪、瞋、昏沉、掉悔、疑；各有「食物」和「不食」的方法\n・四念處：身、受、心、法——「一條讓眾生清淨的路」\n・安般念十六步：從知道呼吸，到觀察無常、離欲、滅\n・四禪：喜樂遍滿全身的四個深度（澡豆、山泉、蓮花、大布）\n・七覺支要看時機：低落時振奮、浮動時平靜\n・慈悲喜捨：在家出家都該修；修慈不會更生氣"}, {"title": "第 18 章　情緒急救：不被情緒帶走的具體方法", "part": "第三部　實作", "text": "══════════════════════════════════════════════\n第 18 章　情緒急救：不被情緒帶走的具體方法\n　　　　　（貪、瞋、怕、焦慮、低落）\n══════════════════════════════════════════════\n\n（承上）第 17 章的方法多半在靜坐時練。這一章把它們帶到日常最需要的時刻：情緒來的時候。\n\n這一章把前面散在各章的方法集中起來，專門回答一個問題：\n「情緒來的時候，經典教我們具體怎麼做？」\n\n18-0　先說清楚：「切斷情緒」在佛教是什麼意思\n──────────────────\n🔴 不是：\n　・壓抑、假裝沒有（那是把火關進櫃子，遲早燒出來）\n　・變成沒感覺的木頭（佛陀照樣有感受，第 14 章）\n　・永遠不再有任何情緒反應（那不是人，是石頭）\n\n✅ 是：\n　・切斷的是「鏈條」，不是「感受」\n　・情緒來了 → 知道它來了 → 不再加柴 → 它自己熄掉\n　・讓情緒「經過」你，而不是「駕駛」你\n\n用第 7、8、10 章的鏈條來看，一個情緒是這樣長出來的：\n\n　接觸（看到、聽到、想到）\n　　↓\n　受：好／壞／平\n　　↓\n　想：貼標籤、編故事（「他就是看不起我」）\n　　↓\n　愛／瞋：想抓或想推\n　　↓\n　取：認同、抓住（「我」很生氣、「他」害我）\n　　↓\n　有：變成一個「生氣的我」（整個身心都進入這個狀態）\n　　↓\n　業：說出口、做出來\n　　↓\n　後果：關係破裂、事後後悔……然後又成為下一次的「接觸」\n\n（說明：經文說一有接觸，「觸俱生受、想、思」〔雜阿含 273 經〕——感受、認知、意志幾乎是同時生起的。\n　這裡為了方便說明才排成一列；實際上快到難以分辨，所以更需要練習「看見」。）\n\n👉 好消息：這條鏈上「每一環」都可以切。越早切越省力，但晚了也有晚的方法。\n　 下面照「從早到晚」排列：入口 → 感受 → 念頭 → 已經爆發 → 事後。\n\n18-1　第零步：知道（這一步永遠第一）\n──────────────────\n不管用什麼方法，第一步都是「知道」。四念處的「心念處」：\n\n【原文】\n「有欲心知有欲心如真，無欲心知無欲心如真，有恚，無恚，有癡，無癡，有穢污，無穢污。\n有合，有散，有下，有高，有小，有大……」\n〔中阿含 98 經《念處經》｜T01 p.0584a｜巴利對應 MN 10〕\n\n【白話】\n「心裡有貪的時候，如實知道『現在心裡有貪』；沒有貪的時候，知道沒有。\n有瞋、沒有瞋；有癡、沒有癡；被污染、沒被污染；收攝、散亂；低落、高昂；狹小、廣大……都如實知道。」\n\n👉 實際做法：在心裡簡單地「命名」——「生氣」「生氣」，或「這是焦慮」。\n　 不用分析原因、不用批判自己（「我怎麼又生氣了」——這又是第二支箭）。\n　 只是像氣象播報員：「現在，心裡有一場雷雨。」\n　 這個動作看起來很小，卻是整個轉變的開始：\n　 「我很生氣」（我＝生氣）→ 變成「心裡有生氣」（生氣是被看到的對象）。\n　 第 8 章說過：念頭和情緒是「心看到的東西」，你可以「看著」它，不必「是」它。\n\n【現代對照】心理學實驗發現，單純把情緒「用語言標記出來」（affect labeling），\n　就能降低大腦杏仁核（與恐懼、威脅反應有關的區域）的活動。（第 24 章）\n\n18-2　第一道防線：入口——不取相\n──────────────────\n（詳見第 16 章 16-4）\n很多情緒在「看到」的那一刻就開始了：看到某人的臉、聽到某個語氣、滑到某則新聞。\n「見色不取相」——看到就是看到，不去抓那個「讓人起反應的特徵」，不在上面編故事。\n\n實用版：\n　・知道自己的「引爆點」（某些人、某些話題、某些時間點、某些 App）\n　・在「接觸之前」就先準備好：「等一下會看到那則留言，我知道我會想反擊」\n　・減少不必要的接觸：不需要的通知關掉、不需要的爭論不點進去\n　（第 16 章引過的雜阿含 271 經：「守護根門，飲食知量，初夜、後夜，覺悟精進」）\n\n18-3　第二道防線：感受——在「受」和「愛」之間停一下\n──────────────────\n（詳見第 7 章 7-3）\n情緒還沒成形之前，先出現的是一個很快的「好／壞」調性。\n如果能在這裡就看到：「哦，這是一個不舒服的感覺」——\n它就還只是一個「感覺」，還沒變成「憤怒」或「焦慮」。\n\n實用版：\n　・注意身體：胸口緊了？臉熱了？胃揪了？肩膀聳起來了？\n　　身體的反應常常比念頭早出現，是很好的警報器\n　・在心裡說：「不舒服」，然後感覺那個不舒服在身體的哪裡、是什麼樣子\n　・不急著「解決」它，只是陪著它幾次呼吸\n　　——第 5 章的第一支箭：痛就是痛，不射第二支箭\n\n18-4　第三道防線：念頭——佛陀教的五種方法\n──────────────────\n情緒最主要的燃料是「念頭」：腦中一直重播、一直編故事、一直辯論。\n中阿含《增上心經》是佛陀專門教「怎麼處理不好的念頭」的經，給了五個由輕到重的方法：\n\n【原文】\n「若比丘欲得增上心者，當以數數念於五相。數念五相已，生不善念，即便得滅，惡念滅已，\n心便常住，在內止息，一意得定。」\n〔中阿含 101 經《增上心經》｜T01 p.0588a｜巴利對應 MN 20〕\n\n【白話】\n「想要提升心的比丘，要常常運用五種方法。運用這五種方法，不好的念頭生起時，就能讓它滅去；\n惡念滅了，心就穩定下來，在內在平息，專一而定。」\n\n──── 方法一：換一個好的念頭 ────\n【原文】\n「念相善相應，若生不善念者，彼因此相復更念異相善相應，令不生惡不善之念。……\n猶木工師、木工弟子，彼持墨繩，用拼於木，則以利斧，斫治令直。」\n【白話】\n「如果在想某件事時，生起了不好的念頭，就換去想另一件與善相應的事，讓不好的念頭不再生起。\n……就像木匠用墨繩在木頭上彈出直線，再用利斧把木頭削直。」\n👉 實例：\n　 想到某人就生氣 → 換成想他做過的好事（下面 18-6 的「五除惱法」就是這一招的細節）\n　 一直想吃甜食 → 換成想它對身體的影響，或去做一件讓自己專注的事\n　 擔心明天 → 換成想「現在能做的一件小事」\n　 這是最溫和、最常用的方法。\n\n──── 方法二：看見這個念頭的過患 ────\n【原文】\n「彼觀此念惡有災患，此念不善，此念是惡，此念智者所惡，此念若滿具者，則不得通、不得覺道、\n不得涅槃……猶人年少，端政可愛，沐浴澡洗，著明淨衣，以香塗身……\n或以死蛇、死狗、死人食半青色，膖脹臭爛，不淨流出，繫著彼頸，彼便惡穢，不喜不樂。」\n【白話】\n「觀察這個念頭的禍害：這個念頭不好、這個念頭是惡的、有智慧的人厭惡這個念頭，\n如果讓它長成，就不能得到智慧、覺悟和涅槃……\n就像一個年輕人，長得端正好看，剛洗完澡、穿上乾淨衣服、塗了香，\n有人把一條死蛇、死狗或半腐爛的屍體掛在他脖子上——他會覺得噁心，立刻想甩掉。」\n👉 實例：\n　 正在想怎麼回嗆對方 → 問自己：「如果我這樣說，明天、下個月、一年後，我會怎麼看自己？」\n　 想再滑一下手機 → 想想上一次滑到凌晨三點，隔天的樣子\n　 重點是「真的看見」它的害處，不是罵自己。看清楚了，心自然想甩掉。\n\n──── 方法三：不理它 ────\n【原文】\n「不念念時……彼比丘不應念此念，令生惡不善念故。……猶有目人，色在光明，而不用見，\n彼或閉目，或身避去。」\n【白話】\n「（如果前兩個方法都不行）就不要去想這個念頭……就像一個眼睛好的人，\n在光亮處有東西，他不想看，就閉上眼睛，或轉身走開。」\n👉 實例：\n　 念頭一直回來 → 不跟它辯論，不分析它，轉移注意力到別處（呼吸、身體、手邊的工作）\n　 物理上離開：離開那個房間、放下手機、出去走走\n　 這不是逃避，而是「不給它燃料」——第 17 章：五蓋都是被「不正思惟」餵大的\n\n──── 方法四：追溯念頭的源頭，讓它慢慢緩下來 ────\n【原文】\n「當以思行漸減其念……猶人行道，進路急速，彼作是念：『我何為速？我今寧可徐徐行耶。』\n彼即徐行。復作是念：『我何為徐行？寧可住耶。』彼即便住。復作是念：『我何為住？寧可坐耶。』\n彼即便坐。復作是念：『我何為坐？寧可臥耶。』彼即便臥。如是，彼人漸漸息身麤行。」\n【白話】\n「要讓推動這個念頭的『思行』（念頭背後的意志、衝動）逐漸減緩……\n就像一個人走路走得很急，他想：『我為什麼要走這麼快？慢慢走吧。』就慢下來。\n又想：『為什麼要走？停下來吧。』就站住。『為什麼要站？坐下吧。』就坐下。\n『為什麼要坐？躺下吧。』就躺下。這樣，一個人逐漸讓身體的粗重動作平息下來。」\n👉 這是很高明的方法：不跟念頭正面衝突，而是一層一層「降速」：\n　 「我為什麼這麼急著要回覆？」→「我為什麼一定要現在處理？」→「我現在真的需要做什麼嗎？」\n　 也可以用在身體上：激動時，先放慢說話速度 → 放慢動作 → 坐下 → 慢慢呼吸。\n　 （巴利本的解讀是「追問這個念頭是從哪裡來的」，意思相近：看到推動它的那股力量，並讓它緩下來。）\n\n──── 方法五：咬緊牙關，用心壓住心 ────\n【原文】\n「彼比丘便齒齒相著，舌逼上齶，以心修心，受持降伏，令不生惡不善之念。……\n猶二力士捉一羸人，受持降伏。」\n【白話】\n「（如果前四種都不行）就咬緊牙齒，舌頭頂住上顎，用心去制伏心，強力壓住，不讓惡念生起。\n……就像兩個大力士抓住一個瘦弱的人，把他制伏。」\n👉 這是最後的手段，用在「快要做出無法挽回的事」的時候：\n　 快要動手、快要說出最傷人的話、快要復發成癮行為……\n　 這時候不用講道理，就是「硬撐住」，先不做，撐過這一波。\n　 🔴 注意它的順序是第五：平常不建議一直用「硬壓」，那會很累，也可能反彈。\n\n──── 練成之後 ────\n【原文】\n「便得自在，欲念則念，不念則不念。若比丘欲念則念，不欲念則不念者，是謂比丘隨意諸念，自在諸念跡。」\n〔以上方法一～五及本句，均出自中阿含 101 經《增上心經》｜T01 p.0588a～0589a〕\n【白話】\n「就得到了自在：想要想的時候就想，不想想的時候就不想。這叫做『念頭隨意、在念頭的路上自在』。」\n\n👉 這就是「切斷情緒」最完整的答案：不是沒有念頭、沒有情緒，\n　 而是你成為念頭的主人——要想就想，不想就可以不想。\n\n18-5　佛陀自己怎麼做：把念頭分成兩邊\n──────────────────\n佛陀回憶自己還沒覺悟時，怎麼處理念頭：\n\n【原文】\n「我寧可別諸念作二分，欲念、恚念、害念作一分，無欲念、無恚念、無害念復作一分。……\n生欲念，我即覺生欲念，自害、害他、二俱害，滅慧、多煩勞、不得涅槃。……便速滅。\n……比丘者，隨所思、隨所念，心便樂中。若比丘多念欲念者，則捨無欲念，以多念欲念故，心便樂中。」\n〔中阿含 102 經《念經》｜T01 p.0589a～b｜巴利對應 MN 19〕\n\n【白話】\n「我想：我把念頭分成兩類吧。想佔有、想對抗、想傷害的念頭放一邊；\n放下、善意、不傷害的念頭放另一邊。……\n當想佔有的念頭生起，我就覺察到：『這個念頭生起了。它會傷害自己、傷害別人、兩邊都傷害，\n讓智慧消失、讓人疲累煩惱、不能通往涅槃。』這樣一覺察，它很快就滅了。……\n比丘心裡常常想什麼、常常念什麼，心就會傾向那裡。\n如果常常想佔有的念頭，就會放掉放下的念頭，心就傾向於佔有。」\n\n經文還用了一個比喻：春末田裡種了作物，牧牛的孩子要時時拿著棍子，\n不讓牛跑進別人的田裡——因為他知道牛跑進去，一定會被罵、被打、被綁。\n\n👉 兩個超級實用的重點：\n　 (1) 分類法：不用分析得很複雜，只要問：「這個念頭是『要抓／要推／要傷害』那一邊，\n　 　　還是『放下／善意／不傷害』那一邊？」\n　 (2)「隨所思、隨所念，心便樂中」——你常想什麼，心就變成什麼樣子。\n　 　　每一次餵某個念頭，都是在加深那條路。這是情緒處理最根本的道理。\n\n【現代對照】這幾乎就是現代神經科學說的「神經可塑性」與「習慣迴路」：\n　反覆激發的神經迴路會被強化，越用越順。（第 24 章）\n\n18-6　針對不同情緒的處方\n──────────────────\n經典針對不同的心理狀態，給了不同的「解藥」（第 17 章的五蓋「不食」，加上其他經文）：\n\n【一、生氣、怨恨、看某人不順眼】\n　(1) 慈心：「瞋恚蓋不食？彼慈心思惟」〔雜阿含 715 經〕\n　　　願對方平安。很難的時候，可以先從「願我自己平安」開始，再到中性的人，最後才到那個人。\n　(2) 舍利弗的「五除惱法」——看他好的那一面：\n\n【原文】\n「或有一人身不淨行，口淨行……莫念彼身不淨行也，但當念彼口之淨行，若慧者見，設生恚惱，應如是除。」\n〔中阿含 25 經《水喻經》｜T01 p.0454a｜巴利對應 AN 5.162〕\n\n　舍利弗把讓人生氣的人分成五種，每種配一個比喻：\n　　・行為不好但說話好的人：像在垃圾堆裡撿布做衣服的修行人——只撿乾淨、沒破的那一塊。\n　　　　→ 不要去想他做的壞事，只想他說的好話。\n　　・說話不好但行為好的人：像一個被草蓋住的水池，熱得受不了的人撥開草，照樣能好好洗個澡。\n　　　　→ 撥開他難聽的話，看他做的好事。\n　　・行為和說話都不好、但心裡還有一點點好的人：像路口牛蹄印裡的一點點水，\n　　　　口渴的人用手舀會把它攪濁，只好跪下來用嘴直接喝。\n　　　　→ 放低身段，去找他心裡那一點點善良。\n　　・身口意都不好的人：像一個在長途旅行中病倒、前後都沒有村莊、孤零零的旅人。\n　　　　看到的人應該對他生起「極有哀愍慈念之心」，帶他去村莊、給他藥和食物。\n　　　　→ 這種人最可憐：照這樣下去，他會一直受苦。對他生起悲心，而不是恨。\n　　・身口意都好的人：像村外一座清澈美好的池塘，四周開滿花。\n　　　　→ 想起他的好，就像跳進池塘洗去燥熱。（對好人也會生氣嗎？會——嫉妒、比較、誤會……）\n　　〔以上五個比喻，出自中阿含 25 經《水喻經》｜T01 p.0454a～c〕\n　(3) 二箭：被罵了，那一句話是第一支箭；之後在腦中重播一百次，是自己射的第二支到第一百支箭。\n　(4) 方法三、四：離開現場、放慢\n\n【二、強烈的渴望、想要、上癮、停不下來】\n　(1) 不淨觀／看過患：「貪欲蓋不食？謂不淨觀」〔雜阿含 715 經〕\n　　　看見那個東西「不那麼美好的另一面」：吃完之後的樣子、得到之後的空虛、代價。\n　　　也就是「味、患、離」的「患」（第 5 章）。\n　(2) 守根門：減少接觸觸發物（第 16 章）\n　(3) 方法三（不理它）＋方法四（降速）：「我為什麼一定要現在？」\n　　　渴望像海浪，會升到最高，然後一定會退。不跟著做，只是看著它升起、看著它退。\n　(4) 方法五：真的快撐不住時，咬牙撐過去\n\n【三、焦慮、擔心、坐立不安、腦子停不下來（掉悔）】\n　(1) 寂止思惟：「掉悔蓋不食？彼寂止思惟」〔雜阿含 715 經〕\n　(2) 安般念：把注意力放在呼吸，特別是「讓身行（呼吸）平靜下來」（第 17 章第 4 步）\n　(3) 七覺支的時機：心浮動時，用「輕安、定、捨」，不要再「動腦分析」（擇法）——〔雜阿含 714 經〕\n　(4) 活在當下：\n\n【原文】\n「慎莫念過去，亦勿願未來，過去事已滅，未來復未至。現在所有法，彼亦當為思，念無有堅強，慧者覺如是。」\n〔中阿含 165 經《溫泉林天經》｜T01 p.0697a｜巴利對應 MN 133〕\n\n【白話】\n「不要追念過去，也不要期盼未來。過去的已經滅了，未來的還沒有來。\n對於現在的事物，就在現在好好觀察；知道一切都不堅固——有智慧的人這樣覺知。」\n\n　👉 焦慮幾乎都住在「未來」，後悔幾乎都住在「過去」。\n　 　把心帶回「現在這一口呼吸、現在這一步」，焦慮就少了很多立足的地方。\n　 　「莫念過去」不是說不能計畫、不能反省，而是不要「被拉進去、住在裡面」。\n\n【四、低落、無力、提不起勁、沮喪（昏沉）】\n　(1) 明照思惟：「睡眠蓋不食？彼明照思惟」〔雜阿含 715 經〕\n　　　讓心亮起來：到光亮的地方、打開窗、洗把臉、起來走動。\n　(2) 七覺支的時機：心低落時，用「擇法、精進、喜」（動腦、動身、想想讓人歡喜的善事）——\n　　　不要在這時候「放鬆、靜坐、放下」，那會讓心更沉。〔雜阿含 714 經〕\n　(3) 六隨念：「佛念、法念、僧念、戒念、施念、天念」〔長阿含 9 經《眾集經》｜T01 p.0052a〕\n　　　回想佛陀的品德、法的好處、修行同伴、自己守戒的清淨、自己布施過的好事——\n　　　這些是讓心「歡悅」的方法（第 16 章：歡悅 → 喜 → 定）。\n　(4) 善知識：雜阿含 91 經說好朋友能讓「已生憂苦能令開覺」（第 21 章）。去找一個好朋友。\n\n【五、後悔、愧疚、自責】\n　(1) 承認、懺悔、下決心、往前走（第 16 章 16-7）\n　(2) 鹽喻：讓自己的「水」變多（第 12 章）\n　(3) 莫念過去：反省一次是智慧，反覆咀嚼一百次是第二支箭\n\n【六、嫉妒、比較】\n　(1) 喜無量心：替別人高興（第 17 章）\n　(2) 想一想「慢」：「我比他好、我跟他一樣、我不如他」——三種都是「慢」（第 20 章），都是苦的來源\n\n【七、害怕、恐懼】\n　(1) 先回到身體和呼吸：恐懼常常讓呼吸變淺變快，先讓呼吸慢下來（安般念第 4 步）\n　(2) 二箭：分清楚「真的危險」（第一支箭）和「腦中想像的災難」（第二支箭）\n　(3) 隨念佛法僧、慈心\n　(4) 若是對「死亡」「失去」的恐懼：經文也教「隨死念」（雜阿含 742 經），\n　　　練習面對無常，反而減少對它的恐懼。（不適合在極度恐慌時進行，要在平靜時練）\n\n18-7　一張「情緒急救卡」\n──────────────────\n（本整理依上面的經文整理而成，不是經文原文）\n\n　情緒來了的時候：\n　　① 停：先不說、不做（必要時：方法五，咬牙撐住）\n　　② 知道：心裡命名「生氣」「焦慮」「想要」\n　　③ 身體：感覺它在身體哪裡；吸氣知道吸、呼氣知道呼，讓呼吸慢下來\n　　④ 分兩邊：這個念頭是「抓／推／傷害」，還是「放下／善意／不傷害」？\n　　⑤ 選一個方法：\n　　　　換念（想好的一面）→ 看過患（想後果）→ 不理它（轉移、離開）→ 降速（為什麼要急？）\n　　⑥ 對症：生氣→慈心、五除惱；想要→看過患；焦慮→回到當下、靜；低落→動起來、想善事\n　　⑦ 事後：不重播。反省一次，然後放下\n\n　平常的保養（比急救更重要）：\n　　・守戒：不做虧心事，心就少很多燃料（第 16 章）\n　　・守根門：減少不必要的刺激\n　　・每天一點安般念、慈心\n　　・常想善的念頭——「隨所思、隨所念，心便樂中」\n\n18-7b　一個完整的例子：開會時被當眾批評\n──────────────────\n（本整理設計的示範情境，把上面的方法串起來。）\n\n【當下】主管在會議上說：「這份報告做得很草率。」全場安靜。\n　① 停：臉一熱，想馬上解釋、反駁。先不開口——方法五：牙齒輕輕咬住，撐過這幾秒。\n　② 知道：心裡默念「生氣」「丟臉」。\n　③ 身體：胸口緊、耳朵熱。吸一口氣，知道在吸；吐一口氣，知道在吐，讓呼吸慢下來。\n　④ 分兩邊：腦中冒出「他根本沒看清楚」「他就是針對我」——這是「推開／對抗」那一邊的念頭。\n　⑤ 選方法：\n　　・降速（方法四）：「我需要現在回應嗎？不需要。我可以會後再談。」\n　　・換念（方法一）：「他說的『草率』，有沒有哪一點是對的？」——如果有，那是有用的資訊。\n　⑥ 對症：如果還是很氣，用「五除惱法」：他說話很直，但上次專案出問題時，是他幫我擋下來的。\n　　　　 （說話不好、但行為好的人——撥開水面的草，照樣能洗澡）\n\n【會後】\n　⑦ 第二支箭：晚上洗澡時，腦中開始排練「我當時應該這樣回他」——第三次、第十次……\n　　 這就是自己射的第二支、第十支箭。發現了，就說「重播」，然後回到洗澡的水溫上（方法三，不理它）。\n　⑧ 反省一次：明天要做的是什麼？——把報告不足的地方補上；找個時間私下談，說明自己的困難。\n　　 想清楚了，就放下。反省一次是智慧，重播一百次是苦。\n\n👉 注意：整個過程沒有「假裝不生氣」，也沒有「把氣吞下去」。\n　 生氣被看見、被允許存在，但沒有讓它開口說話、也沒有讓它在腦中住一整晚。\n\n\n18-8　重要的安全提醒\n──────────────────\n🔴 這一章整理的是經典裡的方法，對日常的情緒很有幫助。但是：\n　・如果是長期、嚴重的憂鬱、焦慮、創傷反應、有傷害自己的念頭，\n　　請一定要找專業的醫師或心理師。佛陀自己生病也看醫生、接受醫藥。\n　・長時間、高強度的禪修，有時會讓壓抑已久的情緒或創傷浮上來。\n　　在沒有老師帶領的情況下，請從短時間、溫和的練習開始。\n　・經典的方法和現代心理治療並不衝突，很多現代療法（正念減壓、正念認知療法等）\n　　本身就是從這些方法發展出來的。\n\n【現代對照】(1) 情緒調節研究（例如心理學家 James Gross 的「過程模型」）把情緒調節分成幾個時間點：\n　選擇情境 → 修改情境 → 轉移注意 → 改變評估 → 調整反應。\n　這跟本章「入口 → 感受 → 念頭 → 爆發 → 事後」的分層幾乎可以一一對照。\n　(2) 成癮治療中的「衝動衝浪」（urge surfing，以正念觀察渴望升起和退去，而不跟著行動），\n　直接來自佛教的正念傳統。\n　(3) 標記情緒（affect labeling）降低杏仁核活動、正念訓練改善情緒調節——研究很多。\n　（研究出處見第 24 章）\n\n18-9　這一章的重點\n──────────────────\n・「切斷情緒」＝切斷鏈條、不加柴，不是壓抑、不是變木頭\n・第一步永遠是「知道」：心裡有生氣，知道有生氣\n・三道防線：入口不取相 → 感受處停一下 → 念頭用五種方法\n・五種方法：換念、看過患、不理、降速、咬牙撐住——由輕到重\n・把念頭分兩邊；「常想什麼，心就變成什麼」\n・對症下藥：生氣→慈、看好的一面；渴望→看過患；焦慮→靜、回到當下；低落→振奮、想善事\n・嚴重的情緒困擾，請找專業協助"}, {"title": "第 19 章　慧：如實看見 → 厭離 → 離欲 → 解脫", "part": "第三部　實作", "text": "══════════════════════════════════════════════\n第 19 章　慧：如實看見 → 厭離 → 離欲 → 解脫\n══════════════════════════════════════════════\n\n（承上）心定了、情緒不再一直把人拉走，才有餘裕看清楚。這一章談三學的最後一環：慧。\n\n19-1　「慧」是什麼\n──────────────────\n・慧（巴利 paññā）：「看清楚」的能力。\n・🔴 不是「聰明、學問多、會講道理」。一個學問很好的人，可能完全看不見自己的貪瞋癡。\n　 一個不識字的人，可能非常清楚地看見心怎麼運作。\n・在佛教裡，「慧」最核心的內容是：如實看見四聖諦、緣起，看見一切身心現象是無常、苦、非我。\n\n【附註．後期】後來的論書把慧分成三種：聞慧（聽聞學習得來的）、思慧（思考得來的）、\n　修慧（親身修習、直接看見得來的）。這個分法在巴利長部 DN 33 已有雛形。\n　這份整理大部分屬於「聞」和「思」；真正的「修慧」要靠自己練習觀察。\n\n19-2　要看見什麼？\n──────────────────\n綜合前面各章，經文要我們「如實知」的內容，主要是這幾組：\n\n(1) 無常、苦、非我（第 11 章）\n(2) 每一樣東西的「集、滅、味、患、離」（第 8、9 章）\n　　集：它怎麼生起的（什麼條件）\n　　滅：它怎麼止息的\n　　味：它的甜頭\n　　患：它的過患\n　　離：怎麼不被它綁住\n(3) 四聖諦（第 6 章）\n(4) 緣起：此有故彼有，此滅故彼滅（第 10 章）\n\n這幾組其實是同一件事的不同角度：「事物是依條件生滅的，不值得緊抓，抓了就苦」。\n\n19-3　從看見到解脫：一條自然的路\n──────────────────\n雜阿含第 9 經和第 1 經把這條路說得最簡潔：\n\n【原文】\n「聖弟子！如是觀者，厭於色，厭受、想、行、識，厭故不樂，不樂故得解脫。\n解脫者真實智生：『我生已盡，梵行已立，所作已作，自知不受後有。』」\n〔雜阿含 9 經｜T02 p.0002a｜巴利對應 SN 22.15〕\n\n【原文】\n「當觀色無常。如是觀者，則為正觀。正觀者，則生厭離；厭離者，喜貪盡；喜貪盡者，說心解脫。」\n〔雜阿含 1 經｜T02 p.0001a〕\n\n把它們和第 16 章的《不思經》合起來，整條路是：\n\n　如實知見 → 厭（厭離）→ 不樂／無欲（離欲）→ 滅 → 解脫 → 解脫知見\n\n每一步是什麼意思？這幾個詞在中文裡特別容易誤會，一個一個講：\n\n(1) 如實知見：如它本來的樣子去看、去知道。不加「我想要它怎樣」的濾鏡。\n\n(2) 厭（厭離，巴利 nibbidā）\n　🔴 不是「討厭、嫌棄、厭世」。\n　 原文的意思比較接近「看膩了、看透了、不再著迷、醒過來」。\n　 比喻：小時候看魔術覺得好神奇，長大後知道了手法，就不再著迷了——\n　 不是討厭魔術，而是「那個魔力消失了」。\n　 或者：玩了很久的電動遊戲，有一天突然覺得「好像也就這樣」，自然放下手把。\n　 看清楚五蘊會變、靠不住、不是我之後，對它們的「著迷」就自然淡了。\n\n(3) 離欲（無欲，巴利 virāga）\n　字面是「褪色」——rāga（貪）本來就有「染色」的意思。\n　離欲就是「那層染上去的顏色褪掉了」。\n　🔴 不是「壓抑慾望」，而是「慾望的顏色自己褪了」。壓抑是用力按住，褪色是不用按也不會再起來。\n\n(4) 滅：渴愛止息。\n\n(5) 解脫（巴利 vimutti）：鬆開、被釋放。像被綁的繩子鬆開了。\n　經文常說「心解脫、慧解脫」：\n　　心解脫——心從貪等煩惱中鬆開\n　　慧解脫——因為智慧（看清楚無明）而鬆開\n　（後來的論書對這兩個詞有更細的區分，這裡取一般的意思。）\n\n(6) 解脫知見：知道自己已經解脫了。經文的標準宣言：\n　「我生已盡，梵行已立，所作已作，自知不受後有。」\n　（我的出生已經結束，清淨的修行已經完成，該做的已經做完，自己知道不會再有下一次的存在。）\n\n👉 整條路最重要的特色，第 16 章說過：「但法自然」——每一步是上一步的自然結果。\n　 你不能「命令自己」厭離、離欲。你能做的是「看清楚」，看清楚了，後面自然發生。\n　 就像你不能命令自己「不怕黑」，但開了燈，看清楚房間裡沒有怪物，怕就自然沒了。\n\n19-4　正見有兩層\n──────────────────\n經典裡（巴利中部 MN 117 等，漢譯中阿含 189 經《聖道經》有對應）把正見分成兩層：\n　(1) 世間的正見：相信有善惡業報、有此世他世、布施有果報、父母有恩……\n　　　這是「讓人生往好方向走」的正見，在家人生活的基礎。\n　(2) 出世間的正見（聖者的正見）：親身看見四聖諦、緣起。\n　　　這是「讓人從輪迴解脫」的正見。\n（這段依巴利經典整理，漢譯對應的原文這份整理尚未逐字引用。）\n\n👉 第一層是第二層的基礎。第 12、13 章講業與輪迴，屬於第一層；第 10、11 章講緣起與無我，屬於第二層。\n\n19-5　日常生活中怎麼練「慧」\n──────────────────\n慧不是坐在那裡「想通一個道理」，而是在經驗中一次又一次地「看見」。\n以下是根據經文原則整理的日常練習（練習設計是本整理的，原則出自經文）：\n\n(1) 看無常：\n　・聽一個聲音，注意它怎麼出現、怎麼消失\n　・觀察一個情緒，注意它的強度怎麼變化——它不是一直一樣強的\n　・注意一個「好心情」怎麼來、怎麼走\n　👉 越常看到，越不會對「它應該一直在」或「它應該快點走」那麼執著\n\n(2) 看緣起（集與滅）：\n　・生氣的時候，事後問：「是哪幾個條件湊在一起，讓我生氣的？」\n　　（睡不夠＋餓＋那句話＋我心裡本來就在擔心某件事……）\n　・發現少了其中一個條件，可能就不會生氣——這就是「此無故彼無」的親身體驗\n\n(3) 看非我：\n　・一個念頭冒出來，注意：「我有決定要想這個嗎？」——大部分念頭是自己冒出來的\n　・身體某處痠痛，注意：「我能命令它不痛嗎？」——第 11 章的論證，在自己身上驗證\n　👉 這不是要讓你覺得「我不存在」，而是鬆開「這一切都要照我的意思」的那份緊抓\n\n(4) 看味、患、離：\n　・面對一個你很喜歡的東西（食物、某個習慣），誠實地看：\n　　它的好處是什麼（味）、代價是什麼（患）、怎樣才能享受它而不被它綁住（離）\n\n19-6　定與慧：互相需要\n──────────────────\n第 17 章說過「止」與「觀」像鳥的兩隻翅膀。\n巴利《法句經》有一句常被引用的話（以下是我依巴利文意譯的白話，不是古代譯本的原文）：\n「沒有智慧的人沒有定，沒有定的人沒有智慧；定與慧都具足的人，就接近涅槃了。」\n（巴利 Dhammapada 372；漢譯《法句經》也有相近的偈，不在四阿含之內。）\n👉 心太散，看不清楚；只有定沒有觀，就像佛陀的兩位老師——很安靜，但沒有看透。\n\n19-7　常見誤會\n──────────────────\n【常見誤會一】「慧就是讀很多經、懂很多道理。」\n　→ 讀經、思考是「聞、思」，很重要，但真正的「慧」是在自己的經驗中親身看見。\n\n【常見誤會二】「厭離就是厭世、對什麼都沒興趣。」\n　→ 厭離是「不再著迷」，像看穿了魔術。覺悟的人反而更有能力享受生活中簡單的事，\n　 　並對眾生有慈悲——佛陀覺悟後積極教學了四十五年。\n\n【常見誤會三】「離欲就是用力壓抑慾望。」\n　→ 離欲是「褪色」：看清楚之後，那份吸引力自己淡了。壓抑是用力按著，按久了會反彈。\n\n【常見誤會四】「看清無我，人就會變得冷漠。」\n　→ 早期經典裡，智慧和慈悲是一起成長的。看清楚自己和別人都在同樣的苦裡掙扎，\n　 　慈悲反而更自然。\n\n【現代對照】心理學有一個概念叫「去中心化」（decentering）或「後設認知覺察」：\n　能夠把念頭和情緒看成「心理事件」，而不是「事實」或「我本身」。\n　研究發現，這種能力是正念認知療法（MBCT）預防憂鬱症復發的重要機制之一。\n　這跟「觀非我」——「這個念頭不是我、不是我的」——非常相似。（第 24 章）\n\n19-8　這一章的重點\n──────────────────\n・慧＝在經驗中看清楚（無常、苦、非我；集、滅、味、患、離；四諦；緣起）\n・路線：如實知見 → 厭離（不再著迷）→ 離欲（褪色）→ 滅 → 解脫 → 解脫知見\n・每一步自然發生；能做的是「看清楚」\n・正見有兩層：世間的（業報）與出世間的（四諦、緣起）\n・日常練習：看無常、看緣起、看非我、看味患離\n・定與慧互相需要"}, {"title": "第 20 章　進度地圖：十種綁住人的繩子，與四個階段", "part": "第三部　實作", "text": "══════════════════════════════════════════════\n第 20 章　進度地圖：十種綁住人的繩子，與四個階段\n══════════════════════════════════════════════\n\n（承上）修行是一條有階段的路。這一章是地圖：哪些繩子先斷、哪些後斷。\n\n20-1　為什麼需要進度地圖\n──────────────────\n修行不是「一下子全部開悟」或「永遠在原地」。早期經典描述了一條有階段的路：\n越往前走，綁住人的「繩子」就斷得越多。這張地圖有兩個用處：\n　(1) 知道自己大概在哪裡、下一步要處理什麼\n　(2) 知道「覺悟」不是神祕的一步登天，而是一條繩子、一條繩子地解開\n\n20-2　十結：十條繩子\n──────────────────\n「結」＝繩結、束縛，把人綁在輪迴裡的東西。共十條，分成兩組：\n\n【五下分結】（把人綁在「下面」——欲界——的五條粗繩子）\n　(1) 身見：把身心（五蘊）當成「我」的見解（第 9、11 章）\n　(2) 戒取（戒禁取）：以為遵守某些規矩、儀式「本身」就能解脫（第 16 章）\n　(3) 疑：對佛、法、僧、修行之路的猶豫不決\n　(4) 欲貪：對感官享受的貪\n　(5) 瞋恚：厭惡、敵意\n\n【五上分結】（把人綁在「上面」——色界、無色界——的五條細繩子）\n　(6) 色貪：對精微境界（例如禪定之樂）的貪\n　(7) 無色貪：對更精微的無形境界的貪\n　(8) 掉舉：細微的浮動不安\n　(9) 慢：「我」比較好、一樣、比較差的那種比較心——最根本的「我是……」的感覺\n　(10) 無明：最根本的看不清\n\n（「五下分結」一詞在四阿含中出現上百次，例如中阿含 205 經《五下分結經》〔巴利對應 MN 64〕。\n　上分結五項的名稱依巴利經典與一般通說列出。）\n\n雜阿含有一經，剛好把這些最細的繩子列在一起，而且說要用什麼來斷：\n\n【原文】\n「無常想修習多修習，能斷一切欲愛、色愛、無色愛、掉、慢、無明。譬如田夫，\n於夏末秋初深耕其地，發荄斷草。如是，比丘！無常想修習多修習，能斷一切欲愛、色愛、無色愛、掉、慢、無明。」\n〔雜阿含 270 經｜T02 p.0070c｜巴利對應 SN 22.102〕\n\n【白話】\n「把『無常』這個認知一再地修習，能斷除一切欲愛、對精微境界的愛、對無形境界的愛、浮動、\n我慢、無明。就像農夫在夏末秋初深耕田地，把草根翻起來、斬斷。\n同樣的，一再修習無常想，能斷除一切……」\n\n👉 最細、最深的繩子（我慢、無明），靠的不是壓制，而是一再地「看見無常」（第 11、19 章）——\n　 像深耕，把草根整個翻出來。\n\n👉 有意思的是順序：最先斷的三條，都是「見解」上的（身見、戒取、疑）——\n　 也就是說，修行最早的突破，是「看法」的改變，不是「慾望」的消失。\n　 慾望（欲貪、瞋恚）是第二批；最細的「我慢」和「無明」到最後才斷。\n\n20-3　四個階段（四果）\n──────────────────\n　(1) 須陀洹（預流）：「進入了水流」——已經進入通往涅槃的河流，不會再倒退\n　　　斷：身見、戒取、疑（三結）\n　(2) 斯陀含（一來）：「還會再來一次」\n　　　斷：同上，而且貪、瞋、癡變得很淡薄\n　(3) 阿那含（不還）：「不會再回到欲界」\n　　　斷：五下分結全部（包括欲貪和瞋恚）\n　(4) 阿羅漢（應供）：「值得供養的人」——完全解脫\n　　　斷：十結全部\n\n中阿含有一段描述預流者：\n\n【原文】\n「知苦如真，知苦習、知苦滅、知苦滅道如真。彼如是知、如是見，三結便盡，謂身見、戒取、疑，\n三結已盡，得須陀洹，不墮惡法，定趣正覺，極受七有，天上、人間七往來已，便得苦際。」\n〔中阿含 4 經《水喻經》｜T01 p.0424b｜巴利對應 AN 7.15〕\n\n【白話】\n「如實知道苦、苦的原因、苦的止息、通往止息的道路。這樣知道、這樣看見，三個結就斷了——\n身見、戒取、疑。三結斷了，就是須陀洹：不會再墮入惡道，必定走向正覺，\n最多再經歷七次生命，在天上和人間往來七次之後，就到達苦的盡頭。」\n\n👉 預流的標準不是「有多少神通」或「入多深的定」，而是「如實知見四聖諦」。\n　 它像是「確定上了正確的路，而且不會再下車」。\n\n經文還把聖者細分成「向須陀洹、得須陀洹……向阿羅漢、得阿羅漢」共八種，稱「四雙八輩」\n（每一果分成「正在走向」和「已經得到」兩個階段）。這句就在下一節「法鏡」那段經文裡，\n用來形容佛弟子的僧團。〔長阿含 2 經《遊行經》｜T01 p.0013b〕\n\n20-4　自我檢查的「法鏡」：怎麼知道自己是不是預流？\n──────────────────\n佛陀說了一面「法的鏡子」，讓修行人可以自己照：\n\n【原文】\n「法鏡者，謂聖弟子得不壞信，歡喜信佛、如來、無所著、等正覺，十號具足。\n歡喜信法：真正微妙，自恣所說，無有時節，示涅槃道，智者所行。\n歡喜信僧，善共和同，所行質直，無有䛕諂，道果成就，上下和順，法身具足。……\n信賢聖戒：清淨無穢，無有缺漏，明哲所行，獲三昧定。\n阿難！是為法鏡，使聖弟子知所生處，三惡道盡，得須陀洹，不過七生，必盡苦際。」\n〔長阿含 2 經《遊行經》｜T01 p.0013b｜巴利對應 DN 16〕\n\n【白話】\n「法鏡是：聖弟子有了不會動搖的信心——歡喜地信佛，是如來、沒有執著、完全覺悟的人；\n歡喜地信法：真實微妙，親自可以體驗，不受時間限制，指出涅槃的道路，有智慧的人會走；\n歡喜地信僧：和合、正直、不虛偽、有成就……\n並且守持聖者所喜愛的戒：清淨、沒有缺損，是明智的人所行的，能帶來定。\n阿難，這就是法鏡，讓聖弟子知道自己會往生哪裡：三惡道已經斷了，是須陀洹，不超過七生，必定到達苦的盡頭。」\n\n這四項叫「四不壞淨」（四種不壞的清淨信心），也叫「預流支」：\n　對佛、法、僧的不壞信心＋聖者所愛的戒\n🔴 注意這裡的「信」：不是「盲信」，而是「已經親身看見了一部分（四聖諦），所以不再動搖」的信。\n　 就像你親自嚐過鹽是鹹的，就不會被人說服「鹽是甜的」。\n　 「法」的形容詞「自恣所說，無有時節」（巴利：sandiṭṭhiko akāliko，「自己可以見到、不受時間限制」）\n　 正說明了這一點。\n\n20-5　最重要的助緣：善知識\n──────────────────\n阿難有一次很興奮地對佛陀說：「我想通了！好朋友、好同伴，是修行的一半！」佛陀說：\n\n【原文】\n「莫作是言：『半梵行者，謂善知識、善伴黨、善隨從，非惡知識、惡伴黨、惡隨從。』所以者何？\n純一滿靜，梵行清白，所謂善知識、善伴黨、善隨從，非惡知識、惡伴黨、惡隨從。\n我為善知識故，有眾生於我所取念覺分，依遠離、依無欲、依滅、向於捨。」\n〔雜阿含 726 經｜T02 p.0195b｜巴利對應 SN 45.2〕\n\n【白話】\n「不要說『好朋友、好同伴是修行的一半』。為什麼？\n完整、圓滿、清淨的修行，就是好朋友、好同伴，而不是壞朋友、壞同伴。\n因為我是（眾生的）好朋友，所以眾生能從我這裡學到念覺分……走向遠離、離欲、止息、捨。」\n\n👉 不是「一半」，是「全部」。這是很強烈的說法。\n　 修行不是一個人關起門來的事。好老師、好同伴，會在你偏掉時提醒你，\n　 在你低落時拉你一把（雜阿含 91 經：善知識「已生憂苦能令開覺」，第 21 章）。\n\n20-6　女性也一樣可以\n──────────────────\n早期經典明白記載，覺悟與性別無關。舍利弗讚歎佛陀的教法：\n\n【原文】\n「世尊所說微妙第一，下至女人，亦能受持，盡有漏成無漏，心解脫、慧解脫，於現法中自身作證：\n生死已盡，梵行已立，所作已辦，不受後有。」\n〔長阿含 18 經《自歡喜經》｜T01 p.0077a｜巴利對應 DN 28〕\n\n【白話】\n「世尊所說的法微妙第一，就連女人也能受持，滅盡煩惱，心解脫、慧解脫，這一生就親身證得……」\n（「下至女人」的說法反映了當時社會對女性的看法，但經文的重點是：女性一樣能證得最高的解脫。）\n佛陀時代有很多比丘尼證得阿羅漢，巴利《長老尼偈》收錄了她們的詩。\n\n20-7　常見誤會\n──────────────────\n【常見誤會一】「開悟是一瞬間、一步到位的神祕經驗。」\n　→ 早期經典描述的是階段性的：一條繩子一條繩子地解開，有「向」有「得」。\n\n【常見誤會二】「證果的標準是神通或很深的禪定。」\n　→ 預流的標準是「如實知見四聖諦，斷身見、戒取、疑」。是「看法」的根本改變。\n\n【常見誤會三】「信佛就是盲信。」\n　→ 四不壞淨的「信」，是建立在「親身看見一部分」之上的信，像嚐過鹽之後知道鹽是鹹的。\n\n【常見誤會四】「證果是古代人的事，現在不可能。」\n　→ 這份整理不替任何人判斷。經文說法是「無有時節」——不受時間限制。\n\n20-8　這一章的重點\n──────────────────\n・十結：五下分結（身見、戒取、疑、欲貪、瞋恚）＋五上分結（色貪、無色貪、掉、慢、無明）\n・四果：預流（斷三結）→ 一來（貪瞋癡薄）→ 不還（斷五下分結）→ 阿羅漢（全斷）\n・最早的突破是「見解」的改變\n・法鏡：對佛法僧的不壞信心＋聖戒＝預流\n・善知識不是修行的一半，是全部\n・覺悟與性別無關"}, {"title": "第 21 章　在家人的佛法：佛陀對一般人說了什麼", "part": "第三部　實作", "text": "══════════════════════════════════════════════\n第 21 章　在家人的佛法：佛陀對一般人說了什麼\n══════════════════════════════════════════════\n\n（承上）前面的教導很多是對出家人說的。最後看佛陀對在家人說了什麼。\n\n很多人以為佛陀只教出家人「放下一切」。其實早期經典裡，\n佛陀對在家人有很多非常實際的教導：怎麼賺錢、怎麼理財、怎麼對待家人和員工、怎麼交朋友。\n而且他對在家人說法，有一個固定的「順序」。\n\n21-1　佛陀對在家人說法的順序\n──────────────────\n經文多次記載，佛陀遇到在家人時，不會一開始就講四聖諦，而是循序漸進：\n\n【原文】\n「如諸佛法，先說端正法，聞者歡悅，謂，說施、說戒、說生天法，毀呰欲為災患，生死為穢，\n稱歎無欲為妙道品白淨。世尊為我說如是法已，佛知我有歡喜心、具足心、柔軟心、堪耐心、\n昇上心、一向心、無疑心、無蓋心，有能有力，堪受正法，謂如諸佛所說正要，\n世尊即為我說苦、習、滅、道。」\n〔中阿含 28 經《教化病經》（給孤獨長者自述）｜T01 p.0460b｜巴利對應 MN 143〕\n\n【白話】\n「就像諸佛的慣例，先說端正的法，讓聽的人歡喜：講布施、講持戒、講（行善）生天，\n說明感官慾望的禍患、生死的污濁，讚歎離欲是美妙清淨的道路。\n世尊說完這些，知道我的心已經歡喜、完整、柔軟、能承受、向上、專一、沒有疑惑、沒有遮蔽，\n有能力接受正法了，就為我說佛法的核心：苦、集、滅、道。」\n\n這段是給孤獨長者（祇園精舍的捐贈者）自述他第一次見佛的經過。順序是：\n　布施 → 持戒 → 善行的好結果 → 慾望的過患 → 出離的好處 → 四聖諦\n\n經文還有一個美麗的比喻：「猶如白素易染為色」——心準備好了，就像一塊乾淨的白布，很容易染上顏色。\n\n👉 這個順序本身就是很好的修行指南：\n　 先從「給予」和「不傷害」開始，心變柔軟、變安穩了，才有能力看深刻的道理。\n\n21-2　現在就能過得好的四件事\n──────────────────\n有個年輕人問佛陀：「在家人要做哪些事，才能這一生就安穩快樂？」\n\n【原文】\n「有四法，俗人在家得現法安、現法樂。何等為四？謂方便具足、守護具足、善知識具足、正命具足。」\n〔雜阿含 91 經｜T02 p.0023a｜巴利對應 AN 8.55（AN 8.54 部分相似）〕\n\n　(1) 方便具足（有本事、肯努力）：\n　　「謂善男子種種工巧業處以自營生，謂種田、商賈，或以王事，或以書䟽算畫。\n　　　於彼彼工巧業處精勤修行，是名方便具足。」\n　　白話：靠各種職業謀生——種田、經商、當公務員、做文書會計——在自己的工作上勤奮用功。\n\n　(2) 守護具足（守得住）：\n　　賺來的錢財「如法而得，能極守護」，不讓它被權勢、盜賊、水火、浪費、不愛惜的人敗掉。\n　　白話：正當地賺，好好地保管。\n\n　(3) 善知識具足（交對朋友）：\n　　「如是知識能善安慰，未生憂苦能令不生，已生憂苦能令開覺，未生喜樂能令速生，已生喜樂護令不失」\n　　白話：好朋友能好好安慰你：還沒發生的煩惱讓它不發生，已經有的煩惱幫你想開，\n　　　　　還沒有的快樂讓它快點來，已經有的快樂幫你守住。\n\n　(4) 正命具足（收支平衡）：\n\n【原文】\n「謂善男子所有錢財出內稱量，周圓掌護，不令多入少出也、多出少入也。如執秤者，\n少則增之，多則減之，知平而捨。……若善男子無有錢財而廣散用，以此生活，\n人皆名為優曇鉢果，無有種子，愚癡貪欲，不顧其後。或有善男子財物豐多，不能食用，\n傍人皆言是愚癡人如餓死狗。」\n〔雜阿含 91 經｜T02 p.0023b〕\n\n【白話】\n「善男子對自己的錢財，收入支出都要衡量，周到地管理，不要收入多支出少（太吝嗇），\n也不要支出多收入少（太浪費）。就像拿秤的人，少了就加、多了就減，知道平衡了才放手。……\n如果沒什麼錢卻花錢大方，別人會說他像『優曇鉢果』——（這種果子）沒有種子（沒有未來），\n是愚癡貪欲、不顧以後的人。\n如果很有錢卻捨不得用，旁人會說他是傻瓜，像一隻餓死的狗（有錢卻讓自己挨餓）。」\n\n👉 這就是「中道」在理財上的應用：不揮霍，也不守財奴。兩千多年前的「量入為出」。\n\n21-3　來世也好的四件事\n──────────────────\n年輕人接著問：「那要怎麼做，以後（來世）也安穩快樂？」\n\n【原文】\n「在家之人有四法，能令後世安、後世樂。何等為四？謂信具足、戒具足、施具足、慧具足。……\n云何施具足？謂善男子離慳垢心，在於居家，行解脫施，常自手與，樂修行捨，等心行施，是名善男子施具足。\n云何為慧具足？謂善男子苦聖諦如實知，習、滅、道聖諦如實知，是名善男子慧具足。」\n〔雜阿含 91 經｜T02 p.0023b～c〕\n\n　(1) 信具足：對如來有穩固的信心\n　(2) 戒具足：不殺生、不偷盜、不邪婬、不妄語、不飲酒（五戒）\n　(3) 施具足：「離慳垢心……行解脫施，常自手與，樂修行捨，等心行施」\n　　　白話：心離開吝嗇的污垢，雖然住在家裡，卻能做「放得開」的布施，常常親手給，\n　　　　　　樂於施捨，平等地布施。\n　(4) 慧具足：如實知道苦、集、滅、道\n\n👉 注意第四項：在家人也被期待要有「慧」——如實知四聖諦。\n　 佛法的核心不是只給出家人的。\n\n21-4　《善生經》：佛陀的「在家人生活手冊」\n──────────────────\n長阿含有一部經，是佛陀遇到一個叫善生的年輕人，他每天早上依照父親的遺言，\n朝東南西北上下六個方向禮拜。佛陀說：在聖者的法中，「禮六方」不是這樣禮的——\n然後把六個方向重新解釋成六種人際關係。這部經是早期經典中最完整的「在家倫理」。\n\n【第一部分：要避開的】\n\n【原文】\n「當知四結行者：一者殺生，二者盜竊，三者婬逸，四者妄語，是四結行。云何為四處？\n一者欲，二者恚，三者怖，四者癡。若長者、長者子於此四處而作惡者，則有損耗。」\n〔長阿含 16 經《善生經》｜T01 p.0070b｜巴利對應 DN 31〕\n\n　白話：要避開四種惡行（殺、盜、邪婬、妄語），而人做惡事的四個原因是：\n　　　　貪欲、瞋恚、恐懼、愚癡。\n　👉 「恐懼」也被列為做錯事的原因——很有洞察力。很多謊言和錯事，是因為「怕」。\n\n【原文】\n「六損財業者：一者耽湎於酒，二者博戱，三者放蕩，四者迷於伎樂，五者惡友相得，六者懈墮。」\n〔長阿含 16 經《善生經》｜T01 p.0070b〕\n\n　白話：讓錢財流失的六件事：沉迷喝酒、賭博、放蕩（夜遊、不規律）、迷戀娛樂、交壞朋友、懶惰。\n　經文還一項一項說明它們的害處，例如喝酒有六個過失：\n　「一者失財，二者生病，三者鬪諍，四者惡名流布，五者恚怒暴生，六者智慧日損。」\n　（花錢、生病、跟人打架、壞名聲傳出去、容易暴怒、智慧一天天減少。）\n　〔同經｜T01 p.0070c〕\n\n【第二部分：六個方向＝六種關係，而且都是「雙向」的】\n\n　佛陀把六方解釋成：東＝父母、南＝師長、西＝妻子（配偶）、北＝親族朋友、下＝僕役（員工）、\n　上＝修行人。每一種關係，經文都列出「雙方」各自的五項責任：\n\n　【父母與子女】〔長阿含 16 經《善生經》｜T01 p.0071c〕\n　　子女對父母：「一者供奉能使無乏，二者凡有所為先白父母，三者父母所為恭順不逆，\n　　　四者父母正令不敢違背，五者不斷父母所為正業。」\n　　父母對子女：「一者制子不聽為惡，二者指授示其善處，三者慈愛入骨徹髓，\n　　　四者為子求善婚娶，五者隨時供給所須。」\n　　👉「慈愛入骨徹髓」——愛到骨子裡。\n\n　【老師與學生】\n　　老師對學生：「一者順法調御，二者誨其未聞，三者隨其所問令善解義，四者示其善友，\n　　　五者盡以所知誨授不悋。」——最後一項：把所知道的全部教給學生，不藏私。\n\n　【雇主與員工（經文是「主」與「僮使」）】\n　　雇主對員工：「一者隨能使役，二者飲食隨時，三者賜勞隨時，四者病與醫藥，五者縱其休假。」\n　　白話：依能力分配工作、按時供應飲食、適時給予獎賞、生病給醫藥、讓他們休假。\n　　👉 兩千多年前就講「依能力分工、照顧健康、要有休假」——非常現代。\n\n　【在家人與修行人】\n　　在家人對修行人：身、口、意都帶著慈心，按時布施，不閉門拒絕。\n　　修行人對在家人（六項）：防止他作惡、指引他向善、教他懷善心、讓他聽到沒聽過的、\n　　讓他把聽過的理解好、為他指出往生善處的路。\n\n　（夫妻、親族之間也各有五項，這裡不全列。夫妻的部分反映了當時的社會習俗，\n　　但重點同樣是「互相」——丈夫對妻子也有「相待以禮」「委付家內」等責任。）\n\n👉 《善生經》最大的特色：所有關係都是「雙向」的。\n　 不是「下對上要服從」而已，上對下也有明確的責任。這在當時是很進步的倫理觀。\n\n【經末的偈頌，談到四攝與理財】\n【原文】\n「惠施及輭言，利人多所益，同利等彼己，所有與人共。……\n積財從小起，如蜂集眾花；財寶日滋息，至終無損耗。」\n〔長阿含 16 經《善生經》｜T01 p.0072b〕\n\n【白話】\n「布施、柔和的話、做對別人有益的事、跟別人同甘共苦，把所有的跟人分享。……\n累積財富要從小處開始，就像蜜蜂一朵一朵花地採蜜；財富一天天增長，到最後也不會耗損。」\n（前一句就是後來說的「四攝法」：布施、愛語、利行、同事。）\n\n21-5　在家人也能證果\n──────────────────\n早期經典裡有很多在家人證得初果、二果、三果的記載。\n例如給孤獨長者（上面 21-1）自述「即於坐中見四聖諦」——當場就見道了。\n第 17 章也引過：「男女在家、出家，常當勤修慈心解脫」。\n【附註】經文中在家人證得阿羅漢的記載極少，一般認為完全的解脫與在家生活較難相容；\n　但前三果在家人都有證得的記載。\n\n21-6　常見誤會\n──────────────────\n【常見誤會一】「學佛就要放棄工作、家庭、財富。」\n　→ 佛陀教在家人好好工作、正當賺錢、好好理財、照顧家人。出家是一種選擇，不是唯一的路。\n\n【常見誤會二】「佛教認為錢是不好的。」\n　→ 經文說的是「如法而得」「等入等出」。問題不在錢，在於怎麼得來、怎麼使用、會不會被它綁住。\n\n【常見誤會三】「在家人只要拜拜、布施就好，智慧是出家人的事。」\n　→ 雜阿含 91 經把「慧具足（如實知四聖諦）」列為在家人四法之一。\n\n21-7　這一章的重點\n──────────────────\n・佛陀對在家人說法的順序：布施 → 持戒 → 善報 → 慾望的過患 → 出離 → 四聖諦\n・現世安樂四法：有本事肯努力、守得住、交對朋友、收支平衡\n・後世安樂四法：信、戒、施、慧\n・《善生經》：避開四惡行與六損財業；六方＝六種「雙向」的關係\n・在家人一樣可以證果"}, {"title": "第 22 章　名相白話對照表", "part": "第四部　工具", "text": "══════════════════════════════════════════════\n第四部　工具\n══════════════════════════════════════════════\n\n\n══════════════════════════════════════════════\n第 22 章　名相白話對照表\n══════════════════════════════════════════════\n\n用法：用 Ctrl+F 搜尋名詞。每一條的格式：\n　【名詞】巴利原文｜字面意思｜白話｜比喻或提醒｜見第幾章\n（巴利拼音只供參考；「字面意思」是原文的基本字義。）\n\n\n■ 一、最基本的\n──────────────────\n【佛陀】buddha｜醒過來的人、知道了的人｜覺悟者｜是人不是神；是發現者不是創造者｜2\n【如來】tathāgata｜如此來（如此去）的人｜佛陀的自稱｜—｜2、14\n【世尊】bhagavant｜有福德的、受尊敬的｜弟子對佛陀的敬稱｜—｜2\n【瞿曇】Gotama｜（姓氏音譯）｜喬達摩，外人對佛陀的稱呼｜像「喬達摩先生」｜2\n【法】dhamma｜支持、規律｜①佛陀的教導 ②事物運作的規律 ③各種現象 ④心的對象｜讀到要先問是哪一義｜4\n【僧】saṅgha｜團體｜修行者的團體｜不是指「一個和尚」｜20\n【比丘／比丘尼】bhikkhu／bhikkhunī｜乞食者｜出家的男眾／女眾｜—｜—\n【沙門】samaṇa｜努力的人｜離家修行的人（不限佛教）｜佛陀時代的一大潮流｜1\n【婆羅門】brāhmaṇa｜祭司階級｜原指祭司種姓；佛陀改用來指真正清淨的人｜舊瓶新酒｜1、12\n【外道】—｜（佛法）以外的道｜佛教以外的修行者｜原本不是罵人的話｜4\n【梵志】brāhmaṇa（也譯婆羅門）｜—｜漢譯阿含常用來稱婆羅門或其他修行者｜經文中「沙門、梵志」＝各種修行人｜1、12\n【優婆塞／優婆夷】upāsaka／upāsikā｜近事者｜在家的男／女信眾｜—｜16、21\n【梵行】brahmacariya｜（追求）梵的行為｜清淨的修行生活｜佛陀改了意思｜1\n【經／律／論】sutta／vinaya／abhidhamma｜線／規範／對法｜佛陀的教說／僧團規範／後來的系統整理｜論是較晚的｜3\n【阿含】āgama｜傳下來的｜漢譯早期經典｜長、中、雜、增壹｜3\n【尼柯耶】nikāya｜部、集｜巴利早期經典｜長部、中部、相應部、增支部、小部｜3\n\n\n■ 二、苦與苦的原因\n──────────────────\n【苦】dukkha｜（不好的）、不圓滿｜不圓滿、靠不住、不能真正滿足｜輪子裝歪的車｜5\n【五盛陰苦／五取蘊苦】pañcupādānakkhandhā dukkhā｜五個被抓取的蘊是苦｜把身心抓成「我」本身就是苦｜手抓會流掉的沙｜5、9\n【苦苦／壞苦／行苦】—｜—｜痛苦本身／快樂會變／一切組合物不穩定｜三種苦｜5\n【集（習）】samudaya｜一起生起｜苦的原因：渴愛｜漢譯有時寫「習」｜6\n【愛】taṇhā｜渴｜停不下來的想要｜喝鹽水越喝越渴｜4、7\n【欲愛／有愛／無有愛】kāma／bhava／vibhava-taṇhā｜—｜要感官享受／要存在、要成為／要消失｜「想消失」也是渴｜7\n【貪】lobha、rāga｜貪／染色｜想拉過來、抓住｜心被染色｜4、7\n【瞋（恚）】dosa｜惡、敵意｜想推開、消滅、抗拒｜包括煩躁、怕、嫌、無聊｜4、7\n【癡】moha｜迷惑｜看不清｜不是笨｜4、7\n【三不善根／三善根】—｜—｜貪瞋癡／不貪不瞋不癡｜一切惡行善行的根｜7\n【無明】avijjā｜不知道｜不知道四聖諦、緣起；看不清事物的實相｜被霧遮住｜10\n【取】upādāna｜抓取（也有「燃料」義）｜執取：欲取、見取、戒取、我取｜火靠燃料燒｜10\n【有】bhava｜存在、成為｜成為某種存在（欲有、色有、無色有）｜變成「一個生氣的我」｜10、18\n【煩惱】kilesa｜弄髒｜讓心發熱、混濁的東西總稱｜—｜4\n【漏】āsava｜流出、滲出｜心裡一直外流的污染：欲漏、有漏、無明漏｜傷口滲膿｜4\n【結】saṃyojana｜綁在一起｜束縛人的繩子｜十結｜20\n【使（隨眠）】anusaya｜潛伏｜潛伏的傾向，條件一到就醒來｜睡著的狗｜4、5\n【蓋】nīvaraṇa｜遮蓋｜遮住心的五種狀態｜蓋子｜17\n【慢】māna｜（測量、比較）｜比較心：比較好、一樣、比較差都算｜「我是……」的感覺｜20\n【身見】sakkāya-diṭṭhi｜（把）身（當成我）的見解｜把五蘊當成「我」｜三結之一｜20\n【戒取（戒禁取）】sīlabbata-parāmāsa｜執取戒和儀式｜以為規矩儀式本身就能解脫｜三結之一｜16、20\n【見取】diṭṭhi-upādāna｜執取見解｜「只有我的看法對」｜四取之一｜10、15\n\n\n■ 三、身心是怎麼構成的\n──────────────────\n【五蘊（五陰）】pañcakkhandhā｜五堆｜色、受、想、行、識｜咖啡的慢動作重播｜9\n【色】rūpa｜形色｜物質、身體（四大與四大所造）｜不是顏色、不是色情｜4、9\n【受】vedanā｜感受｜感覺的好、壞、平三種調性｜中阿含有時譯作「覺」｜4、9\n【想】saññā｜認知｜認出來、貼標籤｜不是「思考」｜4、9\n【行】saṅkhāra｜一起造作｜①意志、推動力（五蘊中＝思）②一切被組合出來的東西｜看上下文｜4、9\n【識】viññāṇa｜分辨地知道｜某一感官上的「知道」｜不是知識、不是靈魂｜4、9、13\n【思】cetanā｜意圖｜意志、意圖；佛陀說「思就是業」｜水龍頭｜9、12\n【名色】nāmarūpa｜名與色｜心理的部分＋身體＝身心｜跟識像三根蘆葦｜10\n【四大】mahābhūta｜大元素｜地（堅）、水（濕）、火（熱）、風（動）｜物質的四種性質，不是化學元素｜4\n【六根（六入處、六內處）】saḷāyatana｜六個入口｜眼耳鼻舌身意｜意也是一種感官｜8\n【六境（六外處）】—｜—｜色聲香味觸法｜念頭是意根的對象｜8\n【十二入處】—｜—｜六根＋六境＝「一切」｜—｜8\n【觸】phassa｜接觸｜根、境、識三者相遇｜兩手一拍就有聲音｜4、8\n【心、意、識】citta、mano、viññāṇa｜—｜早期經典常互換，指會知道的心｜猴子換樹枝｜4、11\n【世間】loka｜世界｜經由六根經驗到的世界｜世界的盡頭在六處裡｜6、8\n【我／我所】attā／attaniya｜我／屬於我的｜被檢查的對象｜—｜9、11\n\n\n■ 四、看清事物的方式\n──────────────────\n【無常】anicca｜不恆常｜會變、會壞、會結束｜心比身體變得快｜11\n【無我（非我）】anattā｜不是我｜在五蘊中找不到永恆、能作主的我｜不是「我不存在」｜11\n【空】suñña｜空的｜空掉了「永恆不變」和「我的」｜房間空了，但房間還在｜4\n【緣起】paṭicca-samuppāda｜依靠（條件）而生起｜此有故彼有，此滅故彼滅｜火靠燃料、氧氣、溫度｜10\n【十二因緣】—｜—｜無明、行、識、名色、六入、觸、受、愛、取、有、生、老死｜—｜10\n【中道】majjhimā paṭipadā｜中間的路｜①不縱慾不苦行 ②不落常見斷見｜不是和稀泥｜2、10、15\n【常見／斷見】—｜—｜有永恆的我／死了就斷滅｜兩個極端｜10、11\n【無記】avyākata｜不說明的｜佛陀擱置不答的形而上問題｜先拔箭｜11\n【味、患、離】assāda、ādīnava、nissaraṇa｜甜頭、過患、出離｜看一樣東西的三個面向｜很平衡的看法｜5、19\n【如實知見】yathābhūta-ñāṇadassana｜如其本然地知與見｜不加濾鏡地看清楚｜—｜19\n【正思惟／不正思惟（如理作意／不如理作意）】yoniso／ayoniso manasikāra｜從根源上注意／不從根源上注意｜正確／錯誤地去想、去注意｜五蓋都是被不正思惟餵大的；🔴 跟八正道的「正思惟」（＝正志，sammā-saṅkappa，心的方向）是不同的詞，漢譯剛好撞名｜15、17\n\n\n■ 五、業與輪迴\n──────────────────\n【業】kamma｜行為｜以意圖為核心的身口意行為｜不是命運｜12\n【故作業】—｜故意做的業｜有意圖的行為，必定有報｜不故意的不一定｜12\n【黑業／白業】—｜—｜惡業／善業；不黑不白業＝讓業走到盡頭的修行｜—｜12\n【宿命論】—｜—｜一切都是前世決定的（佛陀反對）｜—｜12\n【輪迴】saṃsāra｜流轉、漂流｜無始以來不停的生死流轉｜—｜13\n【五趣】—｜五種去處｜地獄、畜生、餓鬼、人、天｜六道是後來的說法｜13\n【天】deva｜發光的｜比人長壽快樂的眾生，也會死｜不是上帝｜4、13\n【魔】māra｜死、殺｜死亡、誘惑、障礙的化身｜—｜4\n\n\n■ 六、修行\n──────────────────\n【八正道（八聖道）】ariya aṭṭhaṅgika magga｜高貴的八支道路｜正見、正志、正語、正業、正命、正精進、正念、正定｜八股線不是八步驟｜15\n【正】sammā｜完整、恰當、對準｜對準解脫方向｜射箭對準靶心｜15\n【正志（正思惟）】sammā-saṅkappa｜正確的意向｜心朝向放下、善意、不傷害｜跟「如理作意」的正思惟不同｜15、18\n【戒、定、慧】sīla、samādhi、paññā｜品行、統一、智慧｜三學｜地基、牆、窗｜15\n【戒】sīla｜習慣、品性｜自願培養的品行｜不是外加的規定｜16\n【五戒】—｜—｜不殺、不盜、不邪婬、不妄語、不飲酒｜每一戒都有正面｜16\n【慚、愧】hiri、ottappa｜羞恥、警惕｜健康的道德感｜不是罪惡感｜16\n【守護根門】indriya-saṃvara｜守護感官｜看到就是看到，不取相｜—｜16、18\n【不取相】—｜不抓取（誘人的）相｜不在所見之上編故事｜—｜8、16\n【念】sati｜記得｜記得心該在哪裡，清楚的覺知｜不是思念、不是念經｜4、15\n【正知】sampajañña｜清楚地知道｜知道自己在做什麼、為什麼做｜—｜17\n【定（三昧）】samādhi｜放在一起｜心安住、統一、清楚｜無風房間裡的燈｜17\n【止／觀】samatha／vipassanā｜平息／清楚地看｜讓心靜／看清實相｜鳥的兩隻翅膀｜17\n【禪（四禪）】jhāna｜（深度專注）｜四種深度的專注與喜樂｜澡豆、山泉、蓮花、大布｜17\n【覺、觀（尋、伺）】vitakka、vicāra｜—｜心對對象的初步投注與持續細察｜初禪還有｜17\n【捨】upekkhā｜在旁觀看｜平衡、平靜｜不是冷漠｜17\n【四念處】satipaṭṭhāna｜念的安住處｜身、受、心、法｜一條讓眾生清淨的路｜17\n【安那般那念】ānāpānasati｜入出息念｜觀察呼吸｜十六步｜17\n【五蓋】—｜五個蓋子｜貪欲、瞋恚、昏沉睡眠、掉悔、疑｜五種照不出臉的水｜17\n【七覺支（七覺分）】bojjhaṅga｜覺悟的支分｜念、擇法、精進、喜、輕安、定、捨｜看時機用｜17\n【四無量心】appamaññā｜無量｜慈、悲、喜、捨｜遍滿四方｜17\n【慈】mettā｜友善｜願眾生平安快樂｜「好的愛」｜4、17\n【悲】karuṇā｜—｜願眾生離苦｜—｜17\n【喜（隨喜）】muditā｜—｜替別人高興｜對治嫉妒｜17、18\n【不淨觀】asubha｜不美｜看見身體不美好的一面｜對治貪欲｜17、18\n【隨念】anussati｜一再憶念｜念佛、法、僧、戒、施、天等｜讓心歡悅｜18\n【精進（方便）】viriya／vāyāma｜努力｜恰當的努力｜琴弦不緊不鬆｜15\n【放逸／不放逸】pamāda／appamāda｜鬆懈／不鬆懈｜心沒守在該守的地方／一直保持清醒｜佛陀遺言｜2\n【善知識】kalyāṇamitta｜好朋友｜好老師、好同伴｜不是修行的一半，是全部｜20、21\n【布施】dāna｜給予｜給出去｜修行的第一課｜21\n【四攝】—｜—｜布施、愛語（輭言）、利行、同事｜善生經的偈｜21\n\n\n■ 七、結果\n──────────────────\n【厭（厭離）】nibbidā｜（看）膩了｜看透、不再著迷｜看穿了魔術｜9、19\n【離欲（無欲）】virāga｜褪色｜貪的顏色褪掉｜不是壓抑｜19\n【滅】nirodha｜止息｜渴愛止息、苦止息｜—｜6\n【解脫】vimutti｜鬆開、被釋放｜從煩惱中鬆開｜繩子鬆開｜19\n【心解脫／慧解脫】—｜—｜心從貪等鬆開／因智慧而鬆開｜—｜19\n【涅槃（泥洹）】nibbāna｜吹熄、熄滅｜貪瞋癡的火熄滅｜火熄了不是去了哪裡｜14\n【般涅槃】parinibbāna｜完全熄滅｜常指覺悟者過世｜—｜14\n【有餘／無餘涅槃】—｜—｜活著時的熄滅／過世後｜經文已有這兩個詞，論書再系統化｜14\n【須陀洹（預流）】sotāpanna｜入流者｜斷三結，不再退轉｜進入河流｜20\n【斯陀含（一來）】sakadāgāmī｜一來者｜貪瞋癡淡薄｜—｜20\n【阿那含（不還）】anāgāmī｜不還者｜斷五下分結｜—｜20\n【阿羅漢】arahant｜值得（供養）的人｜完全解脫者｜—｜20\n【四不壞淨】—｜四種不壞的清淨信｜對佛法僧的不壞信＋聖戒｜法鏡｜20\n【我生已盡，梵行已立，所作已作，自知不受後有】—｜—｜覺悟者的宣言（雜阿含用字；長、中阿含用字略異）：出生已結束、修行已完成、該做的已做完、不再有下一次存在｜—｜13、19\n\n\n■ 八、經文裡常出現的人物\n──────────────────\n（格式：【人名】身分｜在本整理哪裡出現）\n【阿難】佛陀的堂弟，長年隨侍的侍者，聽法最多；「如是我聞」的「我」傳統上指他｜2、3、16、20\n【舍利弗（舍梨子）】佛陀弟子中「智慧第一」，很多教理經是他講的｜6、10、14、15、18\n【目犍連（目乾連）】佛陀弟子中「神通第一」，與舍利弗是好友；佛陀教他怎麼對治打瞌睡｜17\n【大迦葉】佛陀弟子中「頭陀（苦修）第一」，傳統說他主持第一次結集｜3\n【摩訶拘絺羅（大拘絺羅）】擅長問答的大弟子，三蘆之喻就是他說的｜6、10\n【優波離】原本是理髮師，「持律第一」，第一次結集時誦出戒律｜3\n【五比丘】佛陀苦行時的五位同伴，第一次說法的對象｜2\n【二十億耳】很用功卻想還俗的弟子，佛陀用彈琴比喻教他中道｜15\n【𠻬帝（嗏帝）】以為「識會不變地去投生」而被糾正的比丘｜13\n【鬘童子（摩羅迦子）】一定要佛陀先回答形上問題的比丘，箭喻的對象｜11\n【婆蹉（婆蹉種出家）】常來問「有沒有我」「如來死後如何」的外道修行者｜11、14\n【阿羅羅伽羅摩／欝陀羅羅摩子】佛陀出家後跟過的兩位禪定老師｜2\n【尼乾子（大雄）】耆那教的創始人；「尼乾」即耆那教徒｜1、12\n【給孤獨長者】大富商，捐贈祇園精舍；聽法時當場見四聖諦｜21\n【善生】每天禮拜六方的年輕人，《善生經》的對象｜21\n【伽藍人（羇舍子）】被各派說法搞糊塗、來問佛陀的村民｜13、16\n【閻浮車】向舍利弗問「什麼是涅槃」的修行者｜14"}, {"title": "第 23 章　常見誤解總整理", "part": "第四部　工具", "text": "══════════════════════════════════════════════\n第 23 章　常見誤解總整理\n══════════════════════════════════════════════\n\n把散在各章的「常見誤會」集中起來，方便複習。每一條後面標了詳細說明在哪一章。\n\n■ 關於佛陀與佛教\n　✗ 佛陀是神，或神的化身。\n　✓ 早期經典裡，佛陀是「醒過來的人」，是發現者，不是創造者。（第 2 章）\n\n　✗ 佛教的經典都是佛陀說的。\n　✓ 佛教經典的數量極多，大部分是後來一兩千年間的發展。最接近佛陀的是四阿含與巴利尼柯耶，\n　　而它們也經過口傳整理。（第 3 章）\n\n　✗ 出家就是看破紅塵、逃避人生。\n　✓ 佛陀出家是為了找「不被老病死打敗的安穩」，是對問題的冷靜判斷。（第 2 章）\n\n　✗ 中道就是凡事差不多、和稀泥。\n　✓ 中道＝實踐上不縱慾不苦行（八正道）、見解上不落常見斷見（緣起）；是「恰當」，不是「隨便」。（第 2、10、15 章）\n\n■ 關於苦與渴愛\n　✗ 佛教說人生都是苦，很悲觀。\n　✓ 苦是診斷，後面接著「苦可以止息」。（第 5、6 章）\n\n　✗ 佛教叫人不要快樂。\n　✓ 佛陀承認快樂（味），也讚美禪定的喜樂；只是提醒它會變（患），要學會不被綁住（離）。（第 5、17 章）\n\n　✗ 痛就是苦。\n　✓ 痛是第一支箭，苦常常是自己射的第二支箭。（第 5 章）\n\n　✗ 「愛」是愛情、親情，所以佛教要人無情。\n　✓ 「愛」是「渴」；佛教的「好的愛」叫慈、悲。（第 4、7 章）\n\n　✗ 佛教要消滅所有慾望。\n　✓ 要止息的是渴愛；想修行、想做善事的「欲」是被鼓勵的。（第 7 章）\n\n　✗ 瞋就是生氣。\n　✓ 瞋是「推開」這一整族：煩躁、怕、嫌、無聊都算。（第 4、7 章）\n\n■ 關於緣起、無我\n　✗ 緣起就是「一切都是緣份、都是注定的」。\n　✓ 緣是條件，條件可以改變，所以結果可以改變。（第 10 章）\n\n　✗ 無我就是「我不存在」，所以做什麼都無所謂。\n　✓ 佛陀不說「有我」也不說「沒有我」，說緣起；「有業報而無作者」——責任和因果都在。（第 11 章）\n\n　✗ 無我就是要消滅自我、沒有自尊。\n　✓ 是看清楚、鬆開緊抓，不是消滅；少了需要拚命保護的「我」，人反而不容易受傷。（第 11 章）\n\n　✗ 佛陀其實說有一個「真我」。\n　✓ 四阿含中佛陀逐項檢查五蘊皆「非我」；「佛性」一詞在四阿含中一次都沒出現。（第 11 章）\n\n　✗ 佛陀不回答那些形上問題，是因為他不知道。\n　✓ 他說那些見解「是苦、是熱」，對解脫沒有幫助，而且問題本身預設了錯誤前提。（第 11 章）\n\n　✗ 「如幻」「空」就是一切都不存在。\n　✓ 早期經典的空＝空掉「永恆不變」和「我的」；如幻＝不是它看起來的那樣。（第 4、9 章）\n\n■ 關於業與輪迴\n　✗ 業就是命運，一切早已注定。\n　✓ 佛陀明確反對宿命論（中阿含 13 經）。業的核心是現在的意圖。（第 12 章）\n\n　✗ 遇到的一切壞事都是前世的業。\n　✓ 這是佛陀反駁的耆那教看法（中阿含 19 經）；業是原因之一，不是全部。（第 12 章）\n\n　✗ 業是神或宇宙法官在記帳。\n　✓ 佛陀反對「一切都是神決定的」；業像自然法則，而且不是機械式的一對一（鹽喻）。（第 12 章）\n\n　✗ 業障要靠儀式、花錢來消。\n　✓ 早期經典中，業的止息靠八正道：改變意圖，培養戒定慧。（第 12 章）\n\n　✗ 有壞念頭就是造了惡業，所以不敢有念頭。\n　✓ 意業指被餵養、成形的意圖；看見念頭不跟著走，本身就是善業。（第 12、18 章）\n\n　✗ 輪迴就是靈魂投胎。\n　✓ 佛陀明確否定「同一個識不變地去投生」（中阿含 201 經）；是依條件相續。（第 13 章）\n\n　✗ 學佛的目標是死後升天。\n　✓ 天界也在輪迴裡；目標是「不受後有」。（第 13 章）\n\n　✗ 一定要先相信輪迴，才能修行。\n　✓ 伽藍經：佛陀對不確定的人，從看得見的貪瞋癡開始。（第 13 章）\n\n■ 關於涅槃\n　✗ 涅槃就是死亡。\n　✓ 涅槃是貪瞋癡熄滅；佛陀覺悟後還活了四十五年。（第 14 章）\n\n　✗ 涅槃就是變成虛無。\n　✓ 「火熄了去哪裡」——問題問錯了。佛陀既不說斷滅，也不說有個我在某處。（第 14 章）\n\n　✗ 涅槃是天堂，或跟宇宙合一。\n　✓ 涅槃不是地方；「梵我合一」正是佛陀檢查過的見解。（第 1、14 章）\n\n■ 關於修行\n　✗ 八正道是八個步驟，要按順序做。\n　✓ 八股線一起編，正見帶頭。（第 15 章）\n\n　✗ 戒是外加的規矩，越嚴格越好。\n　✓ 戒是為了「淨除其心」；執著規矩本身叫「戒取」，是要斷的繩子。（第 16、20 章）\n\n　✗ 犯了戒就不配修行。\n　✓ 承認、懺悔、下決心、繼續往前。（第 16 章）\n\n　✗ 打坐就是放空、什麼都不想。\n　✓ 定是清楚、穩定地安住；放空恍神比較接近昏沉（五蓋之一）。（第 17 章）\n\n　✗ 定越深越好。\n　✓ 定是為了慧；佛陀的兩位老師定很深，但「不趣涅槃」。（第 2、17 章）\n\n　✗ 修行時的喜樂是執著，要排斥。\n　✓ 經文大力讚美禪定的喜樂；要注意的是貪著它。（第 17 章）\n\n　✗ 「切斷情緒」就是壓抑，或變成沒感覺。\n　✓ 是切斷鏈條、不加柴；情緒經過你，而不是駕駛你。（第 18 章）\n\n　✗ 厭離就是厭世，離欲就是壓抑。\n　✓ 厭離＝不再著迷（看穿魔術）；離欲＝貪的顏色自己褪了。（第 19 章）\n\n　✗ 開悟是一瞬間的神祕經驗。\n　✓ 早期經典描述有階段的路：一條一條繩子地解開。（第 20 章）\n\n　✗ 信佛就是盲信。\n　✓ 四不壞淨的「信」建立在親身看見之上，像嚐過鹽就知道是鹹的。（第 20 章）\n\n　✗ 學佛要放棄工作、家庭、財富。\n　✓ 佛陀教在家人好好工作、正當賺錢、收支平衡、照顧家人與員工。（第 21 章）\n\n　✗ 智慧是出家人的事，在家人拜拜就好。\n　✓ 在家人後世安樂四法之一就是「慧具足：如實知四聖諦」。（第 21 章）"}, {"title": "第 24 章　現代心理學與神經科學對照", "part": "第四部　工具", "text": "══════════════════════════════════════════════\n第 24 章　現代心理學與神經科學對照（註解）\n══════════════════════════════════════════════\n\n24-0　先講好規則\n──────────────────\n這一章收集現代研究中，跟早期佛教「高度契合」或「可以互相解釋」的地方。\n讀之前請記住四件事：\n\n　(1) 這些是「類比」與「相互照明」，不是「科學證明了佛法」。\n　　　佛陀用的是內觀的方法，目的是解脫；科學用的是實驗與測量，目的是解釋與預測。\n　　　兩邊從不同的路走到相似的風景，這本身就很有意思，但不要說成同一件事。\n　(2) 研究有強有弱。單一實驗、小樣本、只靠受試者自己回報的結果，都可能被後來的研究修正。\n　　　這裡會盡量標出強弱。\n　(3) 有些佛教主張是科學目前無法檢驗的（例如死後再生、涅槃本身），這裡不做對照，\n　　　也不引用任何「科學證明了輪迴」或「科學否定了輪迴」的說法。\n　(4) 每一條都附了研究出處，想深入可以自己查。標「＊」的是整理時依記憶寫的經典研究、\n　　　這次沒有重新上網核對原文；沒標的是這次有上網核對過摘要的。\n\n──────────────────────────────────────\n24-1　【最契合】心識「剎那生滅、相續」↔ 意識不是一條連續的線\n──────────────────────────────────────\n這是整份整理裡最值得細看的對照。\n\n【佛教這一邊】\n　・「彼心、意、識日夜時刻，須臾轉變，異生、異滅。猶如獼猴遊林樹間，須臾處處，攀捉枝條，放一取一。」\n　　〔雜阿含 289 經〕——心是一連串「這個生、那個滅」的事件，像猴子換樹枝。\n　・「諸行如幻、如炎，剎那時頃盡朽，不實來實去。」〔雜阿含 273 經〕——在剎那間生滅。\n　・「此陰滅已，異陰相續」〔雜阿含 335 經〕——前一組滅了，後一組接上。\n　・「識緣名色……展轉相依」〔雜阿含 288 經〕——識不是獨立存在的，是條件湊齊時生起。\n　【附註．後期】後來的阿毘達磨把這發展成精細的「心剎那」理論\n　　（例如南傳論書說一個認知過程由十七個心剎那組成），那是後期的系統化，不是經文本身。\n\n【科學這一邊】\n　(1) 我們以為「同時」的，是大腦事後對齊的\n　　　光、聲音、觸覺抵達大腦和被處理的速度都不一樣。大腦會在一個「時間窗口」內把它們整合起來，\n　　　讓你覺得「拍手的畫面和聲音是同時的」。在一定的時間差之內，大腦會把它們「綁」成同一個事件。\n　　　（這是知覺研究中的基本現象，常稱為「時間整合窗口」。）\n\n　(2)「後來的」可以改變「之前的」知覺\n　　　有些實驗顯示，晚一點才出現的刺激，會改變我們對「前一刻」所見的知覺：\n　　　・色彩 phi 現象：一個紅點閃一下、接著在旁邊閃一個綠點，人會看到「一個點移動過去，\n　　　　而且在中途變色」——但大腦在看到綠點之前，不可能知道要變成綠色。\n　　　　表示我們「看到的那一刻」，是事後組合出來的。＊（Kolers & von Grünau, 1976）\n　　　・閃光延遲效應的研究也被解釋為：大腦是在事件之後一小段時間內，整合資訊再「決定」你看到什麼。\n　　　　＊（Eagleman & Sejnowski, 2000, Science）\n　　　這種現象稱為「後見」（postdiction）。它的意思是：意識不是即時直播，而是稍微延遲的「剪輯版」。\n\n　(3)「時間切片」模型：意識是一段一段的\n　　　Herzog、Kammer 與 Scharnowski 在 2016 年於《PLoS Biology》發表〈時間切片：一個知覺持續多久？〉，\n　　　提出兩階段模型：\n　　　・第一階段：大腦在「無意識中」以很高的時間解析度、近乎連續地處理各種特徵\n　　　・第二階段：處理完成後，所有特徵在「離散的時刻」一起變成有意識的知覺，\n　　　　這可能發生在刺激出現後好幾百毫秒\n　　　他們用電影來比喻：看起來連續，其實是一格一格的畫面。\n　　　（有評論把它概括為「意識以約 400 毫秒的畫格進行」，但這是二手概括，數字以原論文為準。）\n\n　(4)「知覺是離散的嗎？」——還在爭論\n　　　VanRullen 與 Koch 在 2003 年的回顧〈知覺是離散的還是連續的？〉指出：\n　　　「知覺依賴離散時段」的想法一直有人提，但從未被廣泛接受；\n　　　然而純粹「連續」的解釋又無法說明大量心理物理學資料。\n　　　他們提出不同頻率的腦波振盪可能是離散處理的神經基礎。\n　　　後來 VanRullen 的研究顯示，部分視覺覺察可能以每秒約 7～13 次的週期進行；\n　　　但聽覺方面支持離散的證據大多不成功。🔴 結論：仍有爭議，不是定論。\n\n【對照與差異】\n　✓ 契合：兩邊都說，「連續不斷的意識流」是一種「看起來像」的效果——\n　　 底下是一連串生滅的事件（佛教）／一段段整合後的知覺時刻（科學），被接起來，看起來像一條線。\n　　 「猶如獼猴……放一取一」跟「一格一格的電影畫面」幾乎是同一個比喻。\n　✓ 契合：兩邊都說，「識」依條件生起，不是一個獨立的、一直亮著的燈。\n　✗ 差異：科學講的是「知覺處理的時間結構」，量的是幾十到幾百毫秒；\n　　 佛經的「剎那」並沒有給出可以對應的數字，也不是在講大腦。\n　✗ 差異：佛教講剎那生滅，目的是讓人看見「沒有一個持續不變的我在看」，進而放下執著；\n　　 科學不處理「該不該執著」的問題。\n　👉 最重要的相通處：我們最確信的「我一直都在、一直在看」的感覺，兩邊都認為是「建構出來的」。\n\n【出處】\n　・Herzog, M. H., Kammer, T., & Scharnowski, F. (2016). Time Slices: What Is the Duration of a Percept?\n　　PLoS Biology, 14(4), e1002433.　https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4829156/\n　・VanRullen, R., & Koch, C. (2003). Is perception discrete or continuous? Trends in Cognitive Sciences, 7(5).\n　　https://resolver.caltech.edu/CaltechAUTHORS:20130816-103234420\n　・VanRullen, R. (2016). Perceptual Cycles. Trends in Cognitive Sciences.（回顧）\n　・＊Kolers, P. A., & von Grünau, M. (1976). Shape and color in apparent motion. Vision Research.\n　・＊Eagleman, D. M., & Sejnowski, T. J. (2000). Motion integration and postdiction in visual awareness. Science.\n\n──────────────────────────────────────\n24-2　【高度契合】「我」是拼出來的 ↔ 自我是大腦的建構\n──────────────────────────────────────\n【佛教】五蘊非我；「有業報而無作者」；芭蕉剝到最後沒有硬心（第 9、11 章）。\n\n【科學】\n　・裂腦研究：神經科學家 Michael Gazzaniga 等人研究左右腦被切斷聯繫的病人，\n　　發現左腦有一個「解釋者」，會即時為行為編出一個合理的故事——即使它根本不知道真正的原因。\n　　意思是：我們心中那個「我知道我為什麼這樣做」的聲音，有時是事後編的。＊\n　・哲學家 Thomas Metzinger 主張：世界上沒有「自我」這種實體，只有大腦建構的「自我模型」，\n　　而我們看不見它是模型，所以把它當成真的。＊（Being No One, 2003；The Ego Tunnel, 2009）\n　・神經科學家 Anil Seth 認為，「自我」的感覺是大腦對身體與自身狀態的一連串預測所構成的。＊（Being You, 2021）\n【對照】\n　✓「五蘊中找不到一個不變的、能作主的我；『我』是這些過程串起來的感覺」\n　　 ↔「自我是大腦把許多過程整合而成的模型」——非常相近。\n　✗ 差異：科學說「自我是大腦建構的」；佛陀沒有說「一切都是大腦」，\n　　 而且佛陀連「我就是大腦／身體」這種說法也一併檢查過（「色非是我」）。\n　　 長阿含 28 經中，佛陀對一位主張「這個身體就是我」的修行者也說「且置此我」。\n\n──────────────────────────────────────\n24-3　【高度契合】心持世間去 ↔ 大腦預測並建構世界\n──────────────────────────────────────\n【佛教】「心持世間去，心拘引世間」（雜阿含 1009 經）；「想如春時燄」——認知像陽焰（第 8、9 章）。\n【科學】「預測處理」理論認為：大腦不是被動接收感官訊號，而是不斷預測接下來會感覺到什麼，\n　　　　再用感官訊號修正預測。我們「看到的世界」，很大一部分是大腦的最佳猜測。\n　　　　Anil Seth 稱之為「受控的幻覺」。＊（Clark, 2013, Behavioral and Brain Sciences；Seth, 2021）\n【對照】\n　✓「想」（認出來、貼標籤）是心主動投射上去的 ↔ 知覺有很大一部分是大腦的預測\n　✓ 同一個世界，不同的心經驗成不同的世界 ↔ 不同的預測模型，產生不同的知覺\n　✗ 差異：預測處理是關於知覺機制的科學理論，不涉及「怎麼從苦中解脫」。\n\n──────────────────────────────────────\n24-4　【高度契合】第一支箭與第二支箭 ↔ 疼痛的「強度」與「難受程度」可以分開\n──────────────────────────────────────\n【佛教】凡夫被兩支箭射中（身受＋心受）；聖弟子只被一支（雜阿含 470 經，第 5 章）。\n【科學】\n　・Lutz 等人（2013, NeuroImage）：長期禪修者（實作超過一萬小時的開放覺察禪修）\n　　評估疼痛的「強度」跟新手一樣，但覺得「沒那麼難受」；\n　　而且在疼痛來臨之前，禪修者的「預期性」腦區活動（包括杏仁核）較低——\n　　新手則有較強的預期焦慮。\n　・Zeidan 等人（2011, Journal of Neuroscience）：從沒禪修過的人，經過四天、每次 20 分鐘的正念訓練後，\n　　在熱痛刺激中禪修，「難受程度」平均下降 57%，「強度」下降 40%（樣本 15 人，個別差異很大）。\n【對照】\n　✓ 這幾乎就是「第一支箭（強度，身受）照樣在，第二支箭（難受、預期的恐懼，心受）少了」的實驗版本。\n　✓ Lutz 研究中「預期焦慮較低」，正對應經文說的「不起憂悲稱怨、啼哭號呼」。\n　✗ 研究樣本小，而且是實驗室裡的短暫熱痛，不能直接推論到所有痛苦。\n【出處】\n　・Lutz, A., et al. (2013). Altered anterior insula activation during anticipation and experience of\n　　painful stimuli in expert meditators. NeuroImage.　https://pubmed.ncbi.nlm.nih.gov/23000783/\n　・Zeidan, F., et al. (2011). Brain mechanisms supporting the modulation of pain by mindfulness meditation.\n　　Journal of Neuroscience.　https://newsroom.wakehealth.edu/news-releases/2011/04/demystifying-meditation-brain-imaging-illustrates-how-meditation-reduces-pain\n\n──────────────────────────────────────\n24-5　【高度契合】樂受與渴愛是兩回事 ↔ 「喜歡」與「想要」是兩套系統\n──────────────────────────────────────\n【佛教】受（舒服）→ 愛（渴、停不下來的想要）；兩者是不同的環節，中間可以切開（第 7、10 章）。\n【科學】神經科學家 Kent Berridge 等人的「誘因顯著性」理論：\n　大腦裡「想要」（wanting，被某個東西吸引、要去追）和「喜歡」（liking，真正享受的愉悅）\n　是兩套不同的系統。多巴胺主要負責「想要」，而不是「喜歡」。\n　所以人可以極度想要一個其實沒那麼喜歡的東西——成癮就是極端的例子：\n　越來越想要，卻越來越不享受。＊（Berridge & Robinson, 1998；Berridge, 2009 等）\n【對照】\n　✓「樂受」≈ liking；「渴愛」≈ wanting。佛陀說要斷的是渴愛，不是樂受——\n　 這跟科學發現「想要」可以脫離「喜歡」獨立失控，完全一致。\n　✓ 經文說渴愛像「喝鹽水」——越喝越渴，正是成癮中「想要升高、喜歡下降」的寫照。\n\n──────────────────────────────────────\n24-6　【可互相解釋】渴愛停不下來 ↔ 享樂適應（享樂跑步機）\n──────────────────────────────────────\n【佛教】壞苦：快樂會變；渴愛：有了還要更多（第 5、7 章）。\n【科學】Brickman 與 Campbell（1971）提出「享樂跑步機」：人得到好東西後，快樂很快回到原來的水準，\n　於是又開始追求新的。著名的研究比較了中樂透的人和意外癱瘓的人，發現一段時間後\n　兩組人的快樂程度差距比想像中小。＊（Brickman, Coates, & Janoff-Bulman, 1978）\n　🔴 後來的研究修正：有些重大事件（例如失業、嚴重失能）的影響並不會完全適應回去。＊（Lucas, 2007）\n【對照】✓ 追求外在的好東西，帶來的快樂有「保存期限」——這正是「壞苦」和「求不得苦」。\n\n──────────────────────────────────────\n24-7　【可互相解釋】貪＝拉過來、瞋＝推開 ↔ 趨近與迴避兩大動機系統\n──────────────────────────────────────\n【佛教】樂受→貪（拉）；苦受→瞋（推）；不苦不樂→癡（第 7 章）。\n【科學】心理學家 Jeffrey Gray 等人提出，人的動機大致由「行為趨近系統」與「行為抑制（迴避）系統」主導；\n　Carver 與 White（1994）據此發展出常用的測量量表。＊\n【對照】✓ 兩大方向的劃分非常接近。\n　✗ 差異：心理學把趨近與迴避都視為正常、必要的功能；佛教不是要消滅它們，\n　　 而是看清楚「被它們自動驅使」的那一部分。\n\n──────────────────────────────────────\n24-8　【高度契合】「有恚心知有恚心」↔ 替情緒命名能降低杏仁核反應\n──────────────────────────────────────\n【佛教】心念處：心有瞋，如實知道心有瞋（中阿含 98 經，第 17、18 章）。\n【科學】Lieberman 等人（2007, Psychological Science）用功能性磁振造影發現：\n　看負面情緒圖片時，用語言「標記情緒」（例如選「生氣」這個詞），\n　比起其他處理方式，會降低杏仁核等邊緣系統的活動，並提高右腹外側前額葉的活動。\n　研究者在新聞稿中提到：貼上「生氣」這個詞，杏仁核反應降低；貼上一個無關的人名則不會。\n【對照】✓ 這正是第 18 章「第零步：知道、命名」的實驗支持。\n　✗ 這是單一研究，機制的解釋（哪條神經路徑）屬於推論。\n【出處】Lieberman, M. D., et al. (2007). Putting Feelings Into Words. Psychological Science, 18(5), 421–428.\n　https://pubmed.ncbi.nlm.nih.gov/17576282/\n\n──────────────────────────────────────\n24-9　【高度契合】掉悔、莫念過去勿願未來 ↔ 心智漫遊與不快樂\n──────────────────────────────────────\n【佛教】掉悔蓋＝想家人、想人際、想過去的玩樂（雜阿含 715 經）；「慎莫念過去，亦勿願未來」（中阿含 165 經）。\n【科學】\n　・Killingsworth 與 Gilbert（2010, Science）用手機在隨機時間詢問兩千多位受試者：\n　　「你現在在做什麼？在想什麼？快樂嗎？」發現人有將近一半的時間在想「眼前沒有發生的事」，\n　　而且心思漫遊時，通常比較不快樂。論文標題就是〈漫遊的心是不快樂的心〉。\n　・Brewer 等人（2011, PNAS）發現：有經驗的禪修者，大腦「預設模式網路」\n　　（與心思漫遊、想自己的事有關）的主要節點活動較低，不只在禪修時，休息時也一樣。\n【對照】✓「心跑到過去和未來」與「不安、不快樂」的關聯，經文和實驗說法一致。\n【出處】\n　・Killingsworth, M. A., & Gilbert, D. T. (2010). A Wandering Mind Is an Unhappy Mind. Science, 330, 932.\n　　https://dash.harvard.edu/handle/1/33431727\n　・Brewer, J. A., et al. (2011). Meditation experience is associated with differences in default mode\n　　network activity and connectivity. PNAS.　https://news.yale.edu/2011/11/21/tuning-out-how-brains-benefit-meditation\n\n──────────────────────────────────────\n24-10　【高度契合】觀非我 ↔ 去中心化（把念頭看成念頭）\n──────────────────────────────────────\n【佛教】念頭是「意」這個感官的對象；「此非我、非我所」（第 8、11、19 章）。\n【科學】Teasdale 等人（2002, Journal of Consulting and Clinical Psychology）研究\n　「正念認知療法」（MBCT）預防憂鬱症復發的機制，提出「後設認知覺察」：\n　把負面想法和感受體驗為「心理事件」，而不是「自己」。\n　他們的結論是：這類治療可能是透過「改變人與負面想法的關係」來減少復發，\n　而不是改變對想法內容的相信程度。\n【對照】✓ 這幾乎就是「看著念頭，不必是那個念頭」。\n　✗ 差異：MBCT 的目標是預防憂鬱復發；佛教的「非我」走得更深，指向放下對一切五蘊的執取。\n【出處】Teasdale, J. D., et al. (2002). Metacognitive awareness and prevention of relapse in depression:\n　Empirical evidence. Journal of Consulting and Clinical Psychology, 70(2), 275–287.\n　https://sources.mandala.library.virginia.edu/node/58841\n\n──────────────────────────────────────\n24-11　【可互相解釋】第 18 章的分層 ↔ 情緒調節的「過程模型」\n──────────────────────────────────────\n【佛教】入口（守根門）→ 感受（受）→ 念頭（五種方法）→ 爆發（咬牙撐住）→ 事後（不重播）。\n【科學】心理學家 James Gross 的過程模型把情緒調節分成五個時間點：\n　選擇情境 → 修改情境 → 轉移注意 → 改變認知評估 → 調整反應。\n　前四個是在情緒完全展開之前，最後一個是之後。\n【對照】✓ 守根門 ≈ 選擇／修改情境；方法三（不理它）≈ 轉移注意；\n　方法一、二（換念、看過患）≈ 改變認知評估；方法五（咬牙撐住）≈ 調整反應。\n　兩邊都主張：越早介入越省力。\n【出處】Gross, J. J. (1998). The Emerging Field of Emotion Regulation: An Integrative Review.\n　Review of General Psychology, 2(3), 271–299.（摘要與概述見 https://www.psychiatry.wisc.edu/courses/Nitschke/seminar/gross_2002_psychophys.pdf）\n\n──────────────────────────────────────\n24-12　【直接繼承】渴望像海浪 ↔ 衝動衝浪（urge surfing）\n──────────────────────────────────────\n【佛教】觀察渴愛生起、止息，不跟著做（第 17、18 章）。\n【科學】成癮研究者 Alan Marlatt 與 Sarah Bowen 發展的「正念復發預防」（MBRP）裡，\n　有一個核心練習叫「衝動衝浪」：把渴望看成一波浪，越來越高，然後一定會退；\n　只是觀察它，不跟著行動。MBRP 本身結合了正念減壓（MBSR）與正念認知療法（MBCT）。\n【對照】這不是「相似」，而是現代療法直接從佛教正念傳統借來的方法。\n【出處】Bowen, Chawla, Grow, & Marlatt, Mindfulness-Based Relapse Prevention for Addictive Behaviors\n　（Guilford Press，第二版）。https://www.guilford.com/books/Mindfulness-Based-Relapse-Prevention-for-Addictive-Behaviors/Bowen-Chawla-Grow-Marlatt/9781462545315\n\n──────────────────────────────────────\n24-13　【可互相解釋】「隨所思、隨所念，心便樂中」、業塑造傾向 ↔ 神經可塑性與習慣\n──────────────────────────────────────\n【佛教】常想什麼，心就傾向什麼（中阿含 102 經）；業在塑造自己（第 12、18 章）。\n【科學】心理學家 Donald Hebb（1949）提出：一起反覆激發的神經元，連結會被加強——\n　常被概括成「一起激發的神經元會連在一起」。今天的神經可塑性研究大致支持這個方向：\n　反覆的經驗與練習會改變大腦。習慣研究也發現，重複的行為會逐漸由情境自動觸發。＊\n【對照】✓ 「業的心理面」幾乎可以直接用神經可塑性來說明：每一次反應都在加深那條路。\n　✗ 業的「來世面」不在這個對照範圍內。\n\n──────────────────────────────────────\n24-14　【可互相解釋】第二支箭、後悔 ↔ 反芻\n──────────────────────────────────────\n【佛教】在痛上再加痛（二箭）；後悔會障礙心的安定（不思經，第 5、16 章）。\n【科學】心理學家 Susan Nolen-Hoeksema 等人的研究顯示：對負面情緒反覆咀嚼（反芻）\n　會延長並加深憂鬱，是憂鬱與焦慮的重要風險因子。＊\n【對照】✓「反覆在腦中重播」就是自己一直射的第二支箭。\n\n──────────────────────────────────────\n24-15　【需要謹慎】意圖與「作者」：Libet 的實驗\n──────────────────────────────────────\n【佛教】「有業報而無作者」；念頭多半是自己冒出來的（第 11、19 章）。\n【科學】Benjamin Libet（1983）的實驗常被引用：在人自覺「決定要動」之前，大腦已出現「準備電位」。\n　有人據此說「自由意志是幻覺」。🔴 但後來的研究（例如 Schurger 等人，2012, PNAS）\n　認為準備電位可能只是腦中隨機活動的累積，不一定代表「大腦已經做好決定」。＊\n【對照】這個題目爭議很大，不適合拿來「證明」無我。只能說：\n　「意圖」本身也是條件生起的事件，這點兩邊都不反對。\n　另外要注意：佛教非常重視「意圖」（思就是業），它不是「沒有意志」的宿命論（第 12 章）。\n\n──────────────────────────────────────\n24-16　【安全提醒的根據】禪修不是只有好處\n──────────────────────────────────────\nLindahl 等人（2017, PLoS ONE）訪談了許多西方佛教禪修者與老師，記錄到禪修過程中\n可能出現的困難經驗（例如恐懼、焦慮、知覺改變、舊創傷浮現），有些持續很久。＊\n這支持第 18 章 18-8 的安全提醒：從溫和的練習開始；有嚴重困擾時，請找專業協助，最好有老師帶領。\n\n──────────────────────────────────────\n24-17　不做對照的部分\n──────────────────────────────────────\n・死後再生、天界、地獄：科學方法目前無法檢驗，這裡不對照。\n・涅槃本身：經文說它「甚深廣大，無量無數」，不在任何實驗能測量的範圍裡。\n・網路上常見的「量子物理證明了佛法」之類的說法：多半是誤用物理名詞，這份整理不採用。\n\n24-18　這一章的重點\n──────────────────\n・最契合：意識不是連續的直線（剎那生滅、相續）；自我是建構的；知覺是心所構成的；\n　疼痛的強度與難受可以分開（二箭）；喜歡與想要是兩回事（受與愛）；標記情緒有效；\n　心思漫遊與不快樂；去中心化（觀非我）\n・可互相解釋：享樂適應、趨近迴避、情緒調節的分層、神經可塑性、反芻\n・直接繼承：正念減壓、正念認知療法、衝動衝浪——都是從佛教正念傳統發展出來的\n・要謹慎：Libet 實驗；研究樣本小；禪修也有風險\n・不對照：再生、涅槃"}, {"title": "第 25 章　經文出處索引，與自己查經的方法", "part": "第四部　工具", "text": "══════════════════════════════════════════════\n第 25 章　經文出處索引，與自己查經的方法\n══════════════════════════════════════════════\n\n25-1　這份整理的引文是怎麼查證的\n──────────────────\n・每一段【原文】都從 CBETA 電子佛典（現由財團法人佛教電子佛典基金會維護；資料版本 2026.R2）\n　的官方資料，抓取整卷經文，逐字比對過。\n・比對時忽略標點差異（不同版本的標點常不一樣），但文字本身要完全一致。\n・最後一次自動核對（2026-10-25）：117 段【原文】中，111 段逐字找到原文、出處也相符；\n　其餘 6 段經人工確認也沒有錯：5 段是說明文字被誤判（例如緊接在引文後的白話說明），\n　1 段是同一段經文在中阿含 81 經和 98 經都有，程式先找到 81 經（本書引的 98 經也有這段）。\n・頁碼（例如 T02 p.0084b）是依實際找到的位置訂正過的。\n・巴利對應經號，是用 SuttaCentral 網站的平行經資料（離線版）核對過的；\n　少數 SuttaCentral 沒列對應的，會註明「未列」。\n・引文中的「……」表示中間有省略。\n・少數地方保留了 CBETA 原文的用字（例如「比方」即「北方」），並加註說明。\n\n25-2　自己查經的方法\n──────────────────\n【方法一：CBETA Online（最推薦）】\n　網址：https://cbetaonline.dila.edu.tw/\n　・直接搜尋經文中的一句話（例如「此有故彼有」），會列出所有出處\n　・也可以用冊、頁、欄、行直接找：例如 T02 p.0084b 就是《大正藏》第 2 冊第 84 頁 b 欄\n　・四阿含的編號：長阿含 T0001、中阿含 T0026、雜阿含 T0099、增壹阿含 T0125\n　・小技巧：搜尋時加上範圍限定「阿含部」，可以避開大量後期經典\n\n【方法二：SuttaCentral（漢巴對照）】\n　網址：https://suttacentral.net/\n　・用經號找，例如輸入 sa296（雜阿含 296 經）、ma221（中阿含 221 經）、\n　　da2（長阿含 2 經）、sn12.20（相應部 12.20）、mn63（中部 63 經）\n　・每一部經都會列出其他語言的「平行經」，可以看同一段教導在不同傳承中的樣子\n　・有很多經有中文、英文翻譯\n\n【這份整理怎麼查的】\n　用小程式透過 CBETA 的公開查詢介面（CBETA API）抓整卷經文來逐字比對，\n　巴利對應經號則用 SuttaCentral 的平行經資料核對。\n　一般讀者用上面兩個網站，就能查到同樣的結果。\n\n25-3　讀經的建議順序（如果想讀原典）\n──────────────────\n以下都是本整理引用過、篇幅不長、很適合入門的經：\n　1. 雜阿含 1、9、33 經（五蘊無常、非我）——很短，一次讀完\n　2. 雜阿含 296～300 經（緣起）\n　3. 雜阿含 470 經（二箭）\n　4. 中阿含 98 經《念處經》（四念處）\n　5. 中阿含 101 經《增上心經》、102 經《念經》（處理念頭）\n　6. 中阿含 11 經《鹽喻經》、13 經《度經》（業）\n　7. 中阿含 221 經《箭喻經》（無記）\n　8. 中阿含 200 經《阿梨吒經》（筏喻）\n　9. 長阿含 16 經《善生經》（在家倫理）\n　10. 長阿含 2～4 卷《遊行經》（佛陀最後的旅程，最有故事性）\n\n25-4　全書引用經文索引\n──────────────────\n格式：經名｜大正藏位置｜巴利對應｜在本整理第幾章出現\n（以下由腳本自動整理）\n\n■ 雜阿含經\n　雜阿含 1 經｜T02 p.0001a｜巴利：SN 22.12–14（部分相似）、SN 22.51｜見第 9、19 章\n　雜阿含 9 經｜T02 p.0002a｜巴利：SN 22.15｜見第 9、19 章\n　雜阿含 33 經｜T02 p.0007b｜巴利：SN 22.59（無我相經；SuttaCentral 列為部分相似）｜見第 11、14 章\n　雜阿含 41 經｜T02 p.0009b｜巴利：SN 22.56｜見第 9 章\n　雜阿含 91 經｜T02 p.0023a｜巴利：AN 8.55（AN 8.54 部分相似）｜見第 21 章\n　雜阿含 197 經｜T02 p.0050b｜巴利：SN 35.28｜見第 5 章\n　雜阿含 213 經｜T02 p.0054a｜巴利：—｜見第 4 章\n　雜阿含 232 經｜T02 p.0056b｜巴利：SN 35.85｜見第 4 章\n　雜阿含 233 經｜T02 p.0056c｜巴利：SN 12.44｜見第 6 章\n　雜阿含 234 經｜T02 p.0056c｜巴利：SN 35.116｜見第 8 章\n　雜阿含 254 經｜T02 p.0062c｜巴利：AN 6.55｜見第 15 章\n　雜阿含 262 經｜T02 p.0067a｜巴利：SN 12.15｜見第 10 章\n　雜阿含 265 經｜T02 p.0068c｜巴利：SN 22.95｜見第 9 章\n　雜阿含 266 經｜T02 p.0069b｜巴利：SN 22.99｜見第 13 章\n　雜阿含 270 經｜T02 p.0070c｜巴利：SN 22.102｜見第 20 章\n　雜阿含 271 經｜T02 p.0071a｜巴利：—｜見第 16 章\n　雜阿含 273 經｜T02 p.0072c｜巴利：SN 35.92–93（部分相似）｜見第 8、11、18、24 章\n　雜阿含 274 阿含 111 經《達梵行經》｜T01 p.0600b｜巴利：AN 6.63｜見第 5、12 章\n　中阿含 133 經《優婆離經》｜T01 p.0628b｜巴利：MN 56｜見第 12 章\n　中阿含 165 經《溫泉林天經》｜T01 p.0697a｜巴利：MN 133｜見第 18 章\n　中阿含 200 經《阿梨吒經》｜T01 p.0764b｜巴利：MN 22｜見第 15 章\n　中阿含 201 經《𠻬帝經》｜T01 p.0766c｜巴利：MN 38｜見第 13 章\n　中阿含 204 經《羅摩經》｜T01 p.0776a｜巴利：MN 26｜見第 2 章\n　中阿含 210 經｜T01 p.0789c｜巴利：MN 44｜見第 5 章\n　中阿含 220 經｜T01 p.0803c｜巴利：—｜見第 11 章\n　中阿含 221 經《箭喻經》｜T01 p.0804c～0805a｜巴利：MN 63｜見第 11 章\n\n■ 長阿含經\n　長阿含 2 經《遊行經》｜T01 p.0015b｜巴利：DN 16｜見第 2、4、15、20 章\n　長阿含 9 經《眾集經》｜T01 p.0050b｜巴利：DN 33（另見 SN 38.14）｜見第 5、17、18 章\n　長阿含 12 經《三聚經》｜T01 p.0059c｜巴利：—｜見第 7、17 章\n　長阿含 13 經《大緣方便經》｜T01 p.0060c｜巴利：DN 15｜見第 7 章\n　長阿含 16 經《善生經》｜T01 p.0070b｜巴利：DN 31｜見第 21 章\n　長阿含 18 經《自歡喜經》｜T01 p.0077a｜巴利：DN 28｜見第 20 章\n　長阿含 20 經《阿摩晝經》｜T01 p.0084c｜巴利：DN 3｜見第 16 章"}, {"title": "附錄　佛陀之後：部派、阿毘達磨、大乘", "part": "附錄", "text": "══════════════════════════════════════════════\n附錄　佛陀之後：部派、阿毘達磨、大乘（只為了劃清界線）\n══════════════════════════════════════════════\n\n這份整理只談早期佛教。但你讀其他佛教書籍時，一定會遇到很多「這份整理沒提到」的說法。\n這個附錄用一張簡表，幫你分辨「這是哪個時期、哪個傳統的說法」。\n🔴 這不是價值判斷。後期的發展各有它的意義和深度，只是「不是早期經典的內容」。\n\n────────────────────────────\n時期（大約）　　發展　　　　　　　　　　　　常見名詞（看到就知道是後期的）\n────────────────────────────\n佛滅後～約前 3 世紀\n　　　　　　早期經典逐漸定型　　　　　　　四諦、緣起、五蘊、八正道……（本整理的範圍）\n\n約前 3 世紀～後幾世紀\n　　　　　　部派佛教、阿毘達磨（論）　　　剎那滅論的精細系統、七十五法、心所、\n　　　　　　　　　　　　　　　　　　　　　　三世兩重因果、有餘／無餘涅槃的系統化\n　　　　　　巴利註釋書（約 5 世紀，覺音）　《清淨道論》、十七心剎那、七清淨\n\n約前 1 世紀起\n　　　　　　大乘佛教興起　　　　　　　　　菩薩道、六度、般若空性、\n　　　　　　　　　　　　　　　　　　　　　　佛性、如來藏、淨土、三身佛、\n　　　　　　　　　　　　　　　　　　　　　　「三法印」的固定說法\n　　　　　　中觀（龍樹，約 2 世紀）　　　　一切法自性空、二諦\n　　　　　　唯識（約 4 世紀）　　　　　　　八識、阿賴耶識、萬法唯識\n\n約 6 世紀起\n　　　　　　密教（金剛乘）　　　　　　　　咒、手印、灌頂、本尊\n\n在中國\n　　　　　　天台、華嚴、禪、淨土等宗派　　一念三千、事事無礙、明心見性、\n　　　　　　　　　　　　　　　　　　　　　　念佛往生、話頭、公案\n────────────────────────────\n\n幾個常見的混淆（本整理查證時特別確認過的）：\n　・「佛性」：四阿含中出現 0 次。\n　・「如來藏」：四阿含中只出現 1 次，在增壹阿含的序品（一般認為是較晚的部分）。\n　・「三法印」：四阿含中出現 0 次（雜阿含 80 經有「聖法印」，但內容不是後來的三法印三句）。\n　・「六道」：早期經典常見的是「五趣」，阿修羅成為固定的一道是較晚的分法。\n　・「業障」「消業障」：作為儀式性的說法，屬於後期與民間的發展。\n　・「阿賴耶識」「八識」：唯識學派的理論，早期經典的識只有六識。\n\n如果你讀到一段「佛說」，想知道它是不是早期的：\n　(1) 先查它在不在四阿含或巴利尼柯耶裡（用第 25 章的方法）\n　(2) 如果只出現在大乘經典或祖師語錄裡，那就是後期的發展\n　(3) 兩邊都有的，最可能是早期的共同核心\n\n\n══════════════════════════════════════════════\n後記\n══════════════════════════════════════════════\n\n這份整理從「佛陀那個時代的人在煩惱什麼」開始，\n經過「佛陀看到了什麼」（苦、渴愛、緣起、無常無我、業、涅槃），\n到「佛陀教人怎麼做」（八正道、戒定慧、情緒的處理、進度地圖、在家生活），\n最後加上工具和現代科學的對照。\n\n如果只能記住一句，或許是這一句：\n「此有故彼有，此起故彼起；此無故彼無，此滅故彼滅。」\n——苦是有條件的，所以可以止息。\n\n而佛陀最後的話是：\n「一切萬物無常存者」「無為放逸」——萬物都會過去，所以要保持清醒、好好用功。\n\n整理中如有錯誤，責任在整理者；經文原文以 CBETA 為準。"}];
const KEY = 'buddha-reader-v1';
let state = { ch: 0, ratio: 0, fs: 18, done: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function render(text, term) {
  const lines = text.split('\n');
  const paras = []; let cur = [];
  const flush = () => { if (cur.length) { paras.push(cur); cur = []; } };
  for (const ln of lines) {
    if (/^\s*$/.test(ln) || /^[═─]{5,}\s*$/.test(ln)) { flush(); continue; }
    cur.push(ln);
  }
  flush();
  const hl = s => {
    let h = esc(s);
    if (term) { const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); h = h.replace(new RegExp(t, 'g'), m => '<mark>' + m + '</mark>'); }
    return h;
  };
  const body = ls => ls.map(l => /^〔.*〕\s*$/.test(l.trim()) ? '<span class="cite">' + hl(l.trim()) + '</span>' : hl(l)).join('\n');
  let out = '';
  for (const p of paras) {
    const f = p[0];
    if (/^第[一二三四]部　/.test(f)) { out += '<div class="part">' + hl(f) + '</div>'; continue; }
    if (p.length <= 2 && /^(第 ?\d+ ?章|附　錄|附錄|後記)/.test(f)) { out += '<h2>' + p.map(x => hl(x.trim())).join('<br>') + '</h2>'; continue; }
    if (p.length <= 2 && /^\d+-\d+　/.test(f)) { out += '<h3>' + body(p) + '</h3>'; continue; }
    if (p.length === 1 && /^■/.test(f)) { out += '<h4>' + hl(f.replace(/^■\s*/, '')) + '</h4>'; continue; }
    let m;
    if ((m = f.match(/^[\s　]*【原文】(.*)$/))) {
      const rest = [m[1], ...p.slice(1)].filter((x, i) => i > 0 || x.trim());
      out += '<div class="quote"><p><span class="label">原文</span>' + body(rest) + '</p></div>'; continue;
    }
    if ((m = f.match(/^[\s　]*【白話(.*?)】(.*)$/))) { out += '<p><span class="label">白話' + esc(m[1]) + '</span>' + body([m[2], ...p.slice(1)].filter((x, i) => i > 0 || x.trim())) + '</p>'; continue; }
    if ((m = f.match(/^【(常見誤會[^】]*)】(.*)$/))) { out += '<p class="myth"><span class="label">' + esc(m[1]) + '</span>' + body([m[2], ...p.slice(1)]) + '</p>'; continue; }
    if ((m = f.match(/^【現代對照】(.*)$/))) { out += '<p class="science"><span class="label">現代對照</span>' + body([m[1], ...p.slice(1)]) + '</p>'; continue; }
    if ((m = f.match(/^【(附註[^】]*)】(.*)$/))) { out += '<p class="note"><span class="label">' + esc(m[1]) + '</span>' + body([m[2], ...p.slice(1)]) + '</p>'; continue; }
    if (/^〔.*〕\s*$/.test(f.trim()) && p.length === 1) { out += '<p class="cite-only">' + hl(f.trim()) + '</p>'; continue; }
    if (/^\s*👉/.test(f)) { out += '<p class="point">' + body(p) + '</p>'; continue; }
    out += '<p>' + body(p) + '</p>';
  }
  return out;
}

function show(i, opts) {
  opts = opts || {};
  i = Math.max(0, Math.min(BOOK.length - 1, i));
  const c = BOOK[i];
  $('art').innerHTML = render(c.text, opts.term);
  $('where').innerHTML = (c.part ? esc(c.part) + '　' : '') + '<b>' + esc(c.title) + '</b>';
  const prev = BOOK[i - 1], next = BOOK[i + 1];
  $('nav').innerHTML =
    (prev ? '<button class="btn" data-go="' + (i - 1) + '"><small>上一章</small><span>' + esc(prev.title) + '</span></button>' : '<span style="flex:1"></span>') +
    (next ? '<button class="btn next" data-go="' + (i + 1) + '"><small>下一章</small><span>' + esc(next.title) + '</span></button>' : '<span style="flex:1"></span>');
  state.ch = i; state.done[i] = true; save();
  try { history.replaceState(null, '', '#ch' + i); } catch (e) {}
  buildToc();
  requestAnimationFrame(() => {
    if (opts.term) { const mk = document.querySelector('#art mark'); if (mk) { mk.scrollIntoView({ block: 'center' }); return; } }
    if (opts.ratio) { const h = document.documentElement.scrollHeight - innerHeight; scrollTo(0, Math.max(0, h * opts.ratio)); }
    else scrollTo(0, 0);
    onScroll();
  });
}

function buildToc() {
  let h = '', lastPart = null;
  BOOK.forEach((c, i) => {
    if (c.part && c.part !== lastPart) { h += '<h5>' + esc(c.part) + '</h5>'; lastPart = c.part; }
    h += '<a href="#ch' + i + '" data-go="' + i + '" class="' + (i === state.ch ? 'cur' : '') + '"><span class="done">' + (state.done[i] ? '✓' : '') + '</span><span>' + esc(c.title) + '</span></a>';
  });
  $('toc').innerHTML = h;
}

function openDrawer(on) { $('drawer').hidden = !on; if (on) { const cur = document.querySelector('#toc a.cur'); if (cur) cur.scrollIntoView({ block: 'center' }); } }

let tick = 0;
function onScroll() {
  const h = document.documentElement.scrollHeight - innerHeight;
  const r = h > 0 ? scrollY / h : 0;
  $('prog').style.width = (r * 100).toFixed(1) + '%';
  state.ratio = r;
  clearTimeout(tick); tick = setTimeout(save, 300);
}

function applyFs() { document.documentElement.style.setProperty('--fs', state.fs + 'px'); }

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); const term = g.dataset.term; openDrawer(false); show(+g.dataset.go, term ? { term } : {}); }
});
$('tocBtn').onclick = () => openDrawer(true);
$('shade').onclick = () => openDrawer(false);
$('closeBtn').onclick = () => openDrawer(false);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') openDrawer(false);
  if (!$('drawer').hidden || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') show(state.ch + 1);
  if (e.key === 'ArrowLeft') show(state.ch - 1);
});
$('fsUp').onclick = () => { state.fs = Math.min(28, state.fs + 1); applyFs(); save(); };
$('fsDown').onclick = () => { state.fs = Math.max(14, state.fs - 1); applyFs(); save(); };
addEventListener('scroll', onScroll, { passive: true });
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

$('q').addEventListener('input', () => {
  const t = $('q').value.trim();
  if (t.length < 2) { $('hits').innerHTML = ''; return; }
  let h = '', n = 0;
  BOOK.forEach((c, i) => {
    let k = c.text.indexOf(t);
    let cnt = 0;
    while (k >= 0 && cnt < 3 && n < 60) {
      const s = c.text.slice(Math.max(0, k - 18), k + t.length + 24).replace(/\s+/g, ' ');
      h += '<a href="#ch' + i + '" data-go="' + i + '" data-term="' + esc(t) + '"><small>' + esc(c.title) + '</small>' + esc(s) + '</a>';
      k = c.text.indexOf(t, k + t.length); cnt++; n++;
    }
  });
  $('hits').innerHTML = (n ? '<h5>搜尋結果（' + n + (n >= 60 ? '+' : '') + '）</h5>' : '<h5>沒有找到</h5>') + h;
});

applyFs();
const m = location.hash.match(/^#ch(\d+)$/);
const start = m ? +m[1] : state.ch;
const resumed = !m && (state.ch > 0 || state.ratio > 0.02);
show(start, resumed ? { ratio: state.ratio } : {});
if (resumed) {
  const r = $('resume');
  r.textContent = '已回到上次讀到的地方：' + BOOK[start].title;
  r.hidden = false; setTimeout(() => { r.hidden = true; }, 3500);
}
</script>
